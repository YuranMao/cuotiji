  if (scheduleTimeSlots.length === 0) { showToast('请先添加时段'); return; }
  const todayStr = formatDate(new Date());
  document.getElementById('schId').value = '';
  document.getElementById('schDate').value = todayStr;
  document.getElementById('schSubject').value = '数学';
  document.getElementById('schLabel').value = '';
  document.getElementById('schOldLabel').value = '';
  document.getElementById('schOldSubject').value = '';
  document.getElementById('schOldDate').value = '';
  document.getElementById('schSubTag').value = '';
  document.querySelectorAll('.sch-subtag-btn').forEach(btn => btn.style.opacity = '0.5');
  document.getElementById('schInErrorBook').checked = false;
  document.getElementById('schModalTitle').textContent = '添加今日记录';
  document.getElementById('schSaveBtn').textContent = '保存';
  document.getElementById('schDeleteBtn').style.display = 'none';
  populateSlotCheckboxes(null);
  onSchSubjectChange();

}

function openScheduleModal(slot, date) {
  if (scheduleTimeSlots.length === 0) { showToast('请先添加时段'); return; }
  document.getElementById('schId').value = '';
  document.getElementById('schDate').value = date;
  document.getElementById('schSubject').value = '数学';
  document.getElementById('schLabel').value = '';
  document.getElementById('schOldLabel').value = '';
  document.getElementById('schOldSubject').value = '';
  document.getElementById('schOldDate').value = '';
  document.getElementById('schSubTag').value = '';
  document.querySelectorAll('.sch-subtag-btn').forEach(btn => btn.style.opacity = '0.5');
  document.getElementById('schInErrorBook').checked = false;
  document.getElementById('schModalTitle').textContent = '添加记录';
  document.getElementById('schSaveBtn').textContent = '保存';
  document.getElementById('schDeleteBtn').style.display = 'none';
  populateSlotCheckboxes(slot ? [slot] : null);

async function saveScheduleRecord() {
  const id = document.getElementById('schId').value;
  const recordDate = document.getElementById('schDate').value;
  const subject = document.getElementById('schSubject').value;
  const rawLabel = document.getElementById('schLabel').value.trim();
  const subTag = document.getElementById('schSubTag').value;
  const label = subTag ? subTag + '：' + rawLabel : rawLabel;
  const slots = getCheckedSlots();
  const inErrorBook = document.getElementById('schInErrorBook').checked;
  if (!rawLabel) { showToast('请输入任务名称'); return; }
  if (slots.length === 0) { showToast('请选择时段'); return; }
  try {
    if (id) {
      // 编辑模式：直接更新这一条记录
      const res = await sb.from('daily_schedule').update({
        time_slot: slots[0], record_date: recordDate, subject, label, in_error_book: inErrorBook
      }).eq('id', id);
      if (res.error) throw res.error;
      // 如果选了多个时段，其余时段作为新记录插入
      for (let i = 1; i < slots.length; i++) {
        const res2 = await sb.from('daily_schedule').insert({ time_slot: slots[i], record_date: recordDate, subject, label, in_error_book: inErrorBook });
        if (res2.error) throw res2.error;
      }
    } else {
      // 添加模式：每个时段创建一条记录
      for (const slot of slots) {
        const res = await sb.from('daily_schedule').insert({ time_slot: slot, record_date: recordDate, subject, label, in_error_book: inErrorBook });
        if (res.error) throw res.error;
      }
    }
    await reloadSchedule();
    closeModal('scheduleRecordModal');
    renderScheduleGrid();
  } catch (err) { showToast((id ? '更新' : '添加') + '失败: ' + err.message); }
}

function editScheduleRecordModal(id, subject, label, slot, explicitDate, inErrorBook) {
  if (scheduleTimeSlots.length === 0) { showToast('请先添加时段'); return; }
  const recordDate = explicitDate || '';
  // 解析 label：子标签：任务名称
  const [parsedTag, ...taskParts] = label.split('：');
  const hasSubTag = parsedTag && MATH_SUB_COLORS[parsedTag];
  const subTagVal = hasSubTag ? parsedTag : '';
  const taskLabel = hasSubTag ? taskParts.join('：') : label;
  document.getElementById('schId').value = id;
  document.getElementById('schDate').value = recordDate;
  document.getElementById('schSubject').value = subject;
  document.getElementById('schLabel').value = taskLabel;
  document.getElementById('schSubTag').value = subTagVal;
  document.getElementById('schInErrorBook').checked = !!inErrorBook;
  document.getElementById('schOldLabel').value = label;
  document.getElementById('schOldSubject').value = subject;
  document.getElementById('schOldDate').value = recordDate;
  document.getElementById('schModalTitle').textContent = '编辑记录';
  document.getElementById('schSaveBtn').textContent = '更新';
  document.getElementById('schDeleteBtn').style.display = 'inline-block';
  populateSlotCheckboxes(slot ? [slot] : null);
  onSchSubjectChange();
  // 高亮当前子标签
  document.querySelectorAll('.sch-subtag-btn').forEach(btn => {
    btn.style.opacity = btn.textContent === subTagVal ? '1' : '0.5';
  });
  openModal('scheduleRecordModal');
}

async function deleteScheduleFromModal() {
  const id = document.getElementById('schId').value;
  if (!id) return;
  if (!confirm('确定删除这条记录？')) return;
  try {
    await sb.from('daily_schedule').delete().eq('id', id);
    await reloadSchedule();
    closeModal('scheduleRecordModal');
    renderScheduleGrid();
    showToast('已删除');
  } catch (err) { showToast('删除失败: ' + err.message); }
}

})();
