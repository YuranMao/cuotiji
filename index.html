<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>错题集（按知识点分类）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #f0f2f5;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.app-layout {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.sidebar-overlay { display: none; }
.sidebar {
  width: 280px;
  min-width: 280px;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 8px rgba(0,0,0,.05);
}
.body-row {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid #eee;
}
.sidebar-header h1 { font-size: 18px; color: #1a1a2e; margin-bottom: 4px; }
.sidebar-header .subtitle { font-size: 12px; color: #999; }

.sidebar-actions {
  padding: 10px 12px;
  border-bottom: 1px solid #eee;
  display: flex;
  gap: 6px;
}
.sidebar-actions button {
  flex: 1;
  padding: 9px 8px;
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: #333;
  transition: all .2s;
  white-space: nowrap;
}
.sidebar-actions button:hover { border-color: #4a90d9; color: #4a90d9; }
.sidebar-actions button:active { background: #e8f0fe; }

.sidebar-tree {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
  -webkit-overflow-scrolling: touch;
}

.tree-chapter { margin-bottom: 1px; }
.chapter-header {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  cursor: pointer;
  transition: background .15s;
  gap: 6px;
  position: relative;
}
.chapter-header:hover { background: #f5f7fa; }
.chapter-header.active { background: #e8f0fe; color: #4a90d9; }
.chapter-header .arrow {
  font-size: 10px;
  transition: transform .2s;
  color: #aaa;
  width: 12px;
  flex-shrink: 0;
}
.chapter-header .arrow.expanded { transform: rotate(90deg); }
.chapter-header .icon { font-size: 15px; flex-shrink: 0; }
.chapter-header .name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chapter-header .count {
  font-size: 11px;
  color: #999;
  background: #f0f0f0;
  padding: 1px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}
.chapter-header .del-chapter {
  font-size: 18px;
  color: #ccc;
  cursor: pointer;
  padding: 4px 6px;
  display: none;
  border: none;
  background: none;
  line-height: 1;
  flex-shrink: 0;
}
.chapter-header:hover .del-chapter,
.chapter-header:hover .sort-btn { display: block; }
.chapter-header .del-chapter:hover { color: #e74c3c; }
.sort-btn {
  font-size: 11px;
  color: #bbb;
  cursor: pointer;
  padding: 1px 3px;
  display: none;
  border: none;
  background: none;
  line-height: 1;
  flex-shrink: 0;
}
.sort-btn:hover { color: #4a90d9; }
.edit-btn {
  font-size: 12px;
  color: #bbb;
  cursor: pointer;
  padding: 0 4px;
  border: none;
  background: none;
  opacity: 0;
  transition: opacity .15s;
  vertical-align: middle;
}
.chapter-header:hover .edit-btn,
.kp-item:hover .edit-btn { opacity: 1; }
.edit-btn:hover { color: #4a90d9; }
.kp-edit-btn { font-size: 10px; }
.sort-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  flex-shrink: 0;
  line-height: 1;
}

.kp-list { display: none; }
.kp-list.open { display: block; }
.kp-item {
  display: flex;
  align-items: center;
  padding: 9px 14px 9px 38px;
  cursor: pointer;
  font-size: 13px;
  color: #555;
  gap: 6px;
  transition: background .15s;
}
.kp-item:hover { background: #f5f7fa; }
.kp-item.active { background: #e8f0fe; color: #4a90d9; font-weight: 600; }
.kp-item .kp-dot { font-size: 5px; color: #bbb; flex-shrink: 0; }
.kp-item .kp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kp-item .kp-count {
  font-size: 11px;
  color: #999;
  background: #f0f0f0;
  padding: 1px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}
.kp-item .del-kp {
  font-size: 16px;
  color: #ccc;
  cursor: pointer;
  padding: 2px 4px;
  display: none;
  border: none;
  background: none;
  line-height: 1;
  flex-shrink: 0;
}
.kp-item:hover .del-kp { display: block; }
.kp-item:hover .sort-btn { display: block; }
.kp-item .del-kp:hover { color: #e74c3c; }

/* ---- Tab Navigation ---- */
.tab-nav {
  display: flex;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  gap: 0;
}
.tab-nav button {
  flex: 1;
  padding: 12px 4px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #999;
  border-bottom: 2px solid transparent;
  transition: all .2s;
  position: relative;
}
.tab-nav button.active { color: #4a90d9; border-bottom-color: #4a90d9; }
.tab-nav button:active { background: #f5f7fa; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f0f2f5;
  overflow: hidden;
}
.main-header {
  padding: 14px 20px;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 10;
}
.main-header .menu-btn {
  display: none;
  font-size: 22px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: #333;
  line-height: 1;
}
.main-header .breadcrumb {
  font-size: 14px;
  color: #333;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.main-header .breadcrumb span { color: #999; font-weight: normal; }
.main-header .add-btn {
  padding: 9px 18px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.main-header .add-btn:active { background: #3a7bc8; }
.main-header .add-btn:disabled {
  background: #c0c0c0;
  cursor: not-allowed;
  opacity: .7;
}

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #bbb;
}
.empty-state .empty-icon { font-size: 52px; margin-bottom: 14px; }
.empty-state p { font-size: 14px; line-height: 1.8; }

.question-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.question-card {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  display: flex;
  flex-direction: column;
}
.card-img-wrap {
  width: 100%;
  height: 200px;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  border-bottom: 1px solid #eee;
}
.card-img-wrap img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.card-info { padding: 12px 14px; }
.card-date {
  font-size: 12px;
  color: #999;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.progress-section { margin-bottom: 6px; }
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.progress-header .review-label { font-size: 12px; color: #666; }
.progress-header .review-count { font-size: 12px; font-weight: 600; color: #4a90d9; }
.progress-bar-wrap {
  width: 100%;
  height: 8px;
  background: #e8e8e8;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4a90d9, #5ba0e8);
  border-radius: 4px;
  transition: width .3s ease;
}
.progress-bar-fill.full { background: linear-gradient(90deg, #27ae60, #2ecc71); }
.review-dates {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
  min-height: 20px;
}
.review-date-tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
}
.review-date-tag.tag-correct {
  background: #e6f9ed;
  color: #27ae60;
}
.review-date-tag.tag-wrong {
  background: #fdeaea;
  color: #e74c3c;
}
.card-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  background: #27ae60;
  color: #fff;
  border-radius: 4px;
  margin-bottom: 4px;
}
.card-actions {
  display: flex;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid #f0f0f0;
}
.card-actions button {
  flex: 1;
  padding: 8px 0;
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
  -webkit-tap-highlight-color: transparent;
}
.card-actions .btn-correct {
  border-color: #27ae60;
  color: #27ae60;
  font-weight: 500;
}
.card-actions .btn-correct:active { background: #27ae60; color: #fff; }
.card-actions .btn-wrong {
  border-color: #e74c3c;
  color: #e74c3c;
  font-weight: 500;
}
.card-actions .btn-wrong:active { background: #e74c3c; color: #fff; }
.card-actions .btn-delete {
  border-color: #bbb;
  color: #999;
  font-size: 12px;
  flex: 0.6;
}
.card-actions .btn-delete:active { background: #e74c3c; color: #fff; }

/* ---- Ebbinghaus ---- */
.ebb-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  font-size: 13px;
}
.ebb-table thead th {
  background: #f5f7fa;
  padding: 10px 6px;
  font-weight: 600;
  color: #555;
  border-bottom: 1px solid #eee;
  text-align: center;
  white-space: nowrap;
  font-size: 12px;
}
.ebb-table tbody td {
  padding: 10px 6px;
  text-align: center;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.ebb-table .eb-name { text-align: left; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ebb-table .eb-date { font-size: 12px; color: #888; white-space: nowrap; }
.ebb-chk {
  width: 18px; height: 18px;
  cursor: pointer;
  accent-color: #4a90d9;
}
.ebb-chk:disabled { opacity: .4; cursor: not-allowed; }
.ebb-future { color: #ccc; font-size: 11px; }
.ebb-done { background: #e6f9ed; }
.ebb-due { background: #fff8e1; }
.ebb-head-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.ebb-head-actions button {
  padding: 8px 14px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.ebb-head-actions button:active { background: #3a7bc8; }
.ebb-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.ebb-actions { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.ebb-actions button {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid #d9d9d9;
  background: #fff;
  cursor: pointer;
  color: #666;
}
.ebb-actions button:active { background: #eee; }
.ebb-actions .eb-del { color: #e74c3c; border-color: #f5c6cb; }
.ebb-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
@media (max-width:768px) {
  .ebb-table { font-size: 11px; }
  .ebb-table thead th { padding: 8px 3px; font-size: 10px; }
  .ebb-table tbody td { padding: 8px 3px; }
  .ebb-table .eb-name { max-width: 80px; }
}

/* ---- Timeline ---- */
.tl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tl-inner { min-width: 600px; }
.tl-header {
  display: flex;
  border-bottom: 1px solid #e0e0e0;
  background: #f5f7fa;
  border-radius: 8px 8px 0 0;
}
.tl-label-col {
  width: 70px; min-width: 70px;
  padding: 10px 8px;
  font-weight: 600;
  color: #888;
  font-size: 12px;
  text-align: center;
  border-right: 1px solid #e0e0e0;
}
.tl-days {
  flex: 1;
  display: flex;
}
.tl-day {
  flex: 1;
  min-width: 28px;
  padding: 8px 0;
  text-align: center;
  font-size: 10px;
  color: #999;
  border-right: 1px solid #f0f0f0;
}
.tl-day.weekend { color: #e74c3c; }
.tl-row {
  display: flex;
  border-bottom: 1px solid #f0f0f0;
  background: #fff;
  position: relative;
  min-height: 44px;
}
.tl-row-label {
  width: 70px; min-width: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 13px;
  color: #333;
  border-right: 1px solid #e0e0e0;
  padding: 4px;
}
.tl-row-track {
  flex: 1;
  display: flex;
  position: relative;
  min-height: 44px;
}
.tl-day-slot {
  flex: 1;
  min-width: 28px;
  border-right: 1px solid #f8f8f8;
  position: relative;
}
.tl-event {
  position: absolute;
  top: 4px;
  height: 36px;
  border-radius: 4px;
  padding: 0 8px;
  font-size: 11px;
  color: #fff;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: pointer;
  z-index: 2;
  transition: opacity .2s, box-shadow .2s;
  box-shadow: 0 2px 4px rgba(0,0,0,.15);
}
.tl-event:hover { opacity: .85; box-shadow: 0 4px 8px rgba(0,0,0,.25); }
.tl-event .tl-del {
  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  cursor: pointer;
  opacity: 0;
  padding: 2px 4px;
  background: rgba(0,0,0,.3);
  border-radius: 3px;
}
.tl-event:hover .tl-del { opacity: 1; }
.tl-today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #e74c3c;
  z-index: 3;
  pointer-events: none;
}
.tl-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.tl-toolbar button {
  padding: 8px 14px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.tl-toolbar button:active { background: #3a7bc8; }
.tl-toolbar .tl-nav {
  background: #fff;
  color: #333;
  border: 1px solid #d9d9d9;
  padding: 6px 12px;
  font-size: 12px;
}
.tl-legend {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 11px;
  color: #888;
  align-items: center;
}
.tl-legend span { display: flex; align-items: center; gap: 3px; }
.tl-l-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---- 弹窗 ---- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 24px 20px;
  width: 400px;
  max-width: 100%;
  box-shadow: 0 8px 40px rgba(0,0,0,.15);
}
.modal h3 { font-size: 16px; margin-bottom: 18px; color: #1a1a2e; }
.modal .form-group { margin-bottom: 14px; }
.modal .form-group label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
  font-weight: 600;
}
.modal .form-group input[type="text"],
.modal .form-group input[type="date"],
.modal .form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
  background: #fff;
  -webkit-appearance: none;
}
.modal .form-group input:focus,
.modal .form-group select:focus { border-color: #4a90d9; }

.modal .image-upload-area {
  width: 100%;
  height: 150px;
  border: 2px dashed #d9d9d9;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  overflow: hidden;
  position: relative;
}
.modal .image-upload-area:active { background: #f8fafe; border-color: #4a90d9; }
.modal .image-upload-area.has-image { border-style: solid; }
.modal .image-upload-area img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.modal .image-upload-area .placeholder { color: #bbb; font-size: 13px; text-align: center; }
.modal .image-upload-area .placeholder .upload-icon { font-size: 30px; display: block; margin-bottom: 4px; }
.modal .image-upload-area input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.modal .modal-btns {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.modal .modal-btns button {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  border: none;
  transition: opacity .2s;
}
.modal .modal-btns button:active { opacity: .8; }
.modal .btn-cancel { background: #f0f0f0; color: #666; }
.modal .btn-confirm { background: #4a90d9; color: #fff; }

.img-preview-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.9);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
.img-preview-overlay.show { display: flex; }
.img-preview-overlay img {
  max-width: 92vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 4px;
}

.toast {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  color: #fff;
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 3000;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: #aaa;
  gap: 10px;
  font-size: 13px;
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid #e0e0e0;
  border-top-color: #4a90d9;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.conn-status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: #27ae60;
  background: #fff;
  padding: 4px 12px;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 6px;
}
.conn-status .dot {
  width: 6px;
  height: 6px;
  background: #27ae60;
  border-radius: 50%;
}
.conn-status.error { color: #e74c3c; }
.conn-status.error .dot { background: #e74c3c; }
.conn-status.warn { color: #f39c12; }
.conn-status.warn .dot { background: #f39c12; }

/* 艾宾浩斯完成编辑 */
.eb-edit-inline {
  border: 1px solid #4a90d9;
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 13px;
  outline: none;
  width: 120px;
}

<script>

let cachedKps = [];
let cachedQuestions = [];

// ==================== Tab 切换 ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel' + tab.charAt(0).toUpperCase() + tab.slice(1)));

async function showKpModal() {

function showKpEditModal(kpId, currentName, chapterId) {

async function showQuestionModal() {
  if (!selectedKpId) { showToast('请先选择知识点'); return; }
  const sel = document.getElementById('qKpSelect');

      ${ch ? ch.name + ' > ' : ''}${escapeHtml(kp.name)}

  }).join('');

function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1200, maxH = 1200;
      let w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        const ratio = Math.min(maxW / w, maxH / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      selectedImageData = canvas.toDataURL('image/jpeg', 0.85);
      const area = document.getElementById('imageUploadArea');
      area.classList.add('has-image');
      area.querySelector('.placeholder').style.display = 'none';
      let preview = area.querySelector('img');
      if (!preview) { preview = document.createElement('img'); area.appendChild(preview); }
      preview.src = selectedImageData;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function closeImgPreview() { document.getElementById('imgPreview').classList.remove('show'); }

// ==================== IndexedDB 缓存 ====================
const DB_NAME = 'CuotijiCache';
const DB_VERSION = 2;

function openCacheDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveToCache(data) {
  try {
    const db = await openCacheDB();
    const tx = db.transaction('cache', 'readwrite');
    tx.objectStore('cache').put(data, 'data');
    await new Promise(r => { tx.oncomplete = r; });
    db.close();
  } catch (e) {}
}

async function loadFromCache() {
  try {
    const db = await openCacheDB();
    const tx = db.transaction('cache', 'readonly');
    const req = tx.objectStore('cache').get('data');
    const data = await new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return data;
  } catch (e) { return null; }
}

async function loadAllData() {
  const statusEl = document.getElementById('connStatus');
  try {
    const [cRes, kpRes, qRes] = await Promise.all([
      sb.from('chapters').select('*').order('sort_order', { ascending: true }).order('id'),
      sb.from('knowledge_points').select('*').order('sort_order', { ascending: true }).order('id'),
      sb.from('questions').select('*').order('created_at', { ascending: false })
    ]);

    if (cRes.error) throw cRes.error;
    if (kpRes.error) throw kpRes.error;
    if (qRes.error) throw qRes.error;

    cachedChapters = cRes.data || [];
    cachedKps = kpRes.data || [];
    cachedQuestions = qRes.data || [];

    await saveToCache({ chapters: cachedChapters, kps: cachedKps, questions: cachedQuestions, ebbItems: cachedEbbItems, timeline: cachedTimeline });

    statusEl.className = 'conn-status';
    statusEl.innerHTML = '<span class="dot"></span> 数据已同步';
  } catch (err) {
    console.warn('Supabase 加载失败，尝试离线缓存:', err.message);
    const cache = await loadFromCache();
    if (cache) {
      cachedChapters = cache.chapters || [];
      cachedKps = cache.kps || [];
      cachedQuestions = cache.questions || [];
      cachedEbbItems = cache.ebbItems || [];
      cachedTimeline = cache.timeline || [];
      statusEl.className = 'conn-status warn';
      statusEl.innerHTML = '<span class="dot"></span> 离线模式（上次缓存）';
    } else {
      statusEl.className = 'conn-status error';
      statusEl.innerHTML = '<span class="dot"></span> 无数据，请检查网络';
    }
  }
}

async function moveChapter(id, dir) {
  const idx = cachedChapters.findIndex(c => c.id == id);
  if (idx < 0 || (dir < 0 && idx === 0) || (dir > 0 && idx === cachedChapters.length - 1)) return;
  const swapIdx = idx + dir;
  const a = cachedChapters[idx], b = cachedChapters[swapIdx];
  try {
    await sb.from('chapters').update({ sort_order: (b.sort_order || b.id) }).eq('id', a.id);
    await sb.from('chapters').update({ sort_order: (a.sort_order || a.id) }).eq('id', b.id);
    await reloadChapters();
    await refreshSidebar();
  } catch (err) { showToast('排序失败: ' + err.message); }
}

  if (idx < 0 || (dir < 0 && idx === 0) || (dir > 0 && idx === childKps.length - 1)) return;
  const swapIdx = idx + dir;
  const a = childKps[idx], b = childKps[swapIdx];
  try {
    await sb.from('knowledge_points').update({ sort_order: (b.sort_order || b.id) }).eq('id', a.id);
    await sb.from('knowledge_points').update({ sort_order: (a.sort_order || a.id) }).eq('id', b.id);
    await reloadKps();

async function toggleEbbReview(itemId, intervalDay) {
  const item = cachedEbbItems.find(e => e.id == itemId);
  if (!item) return;
  let reviews = item.reviews || [];
  // Normalize old format (array of strings) to new format (array of objects)
  reviews = reviews.map(r => typeof r === 'string' ? { day: parseInt(r, 10) || 0, date: r } : r);
  const existing = reviews.find(r => r.day === intervalDay);
  if (existing) {
    reviews = reviews.filter(r => r.day !== intervalDay);
  } else {
    reviews.push({ day: intervalDay, date: formatDate(new Date()) });
  }
  try {
    const res = await sb.from('ebbinghaus_items').update({ reviews }).eq('id', itemId);
    if (res.error) throw res.error;
    await reloadEbb();
    renderEbb();
  } catch (err) { showToast('更新失败: ' + (err.message || err.details || JSON.stringify(err))); }
}

function formatDate(d) {
  d = new Date(d);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// 动态计算每个复习轮次的应复习日期（逾期自动后延到今日）
function getEbbDynamicSchedule(item) {
  let reviews = item.reviews || [];
  reviews = reviews.map(r => typeof r === 'string' ? { day: parseInt(r, 10) || 0, date: r } : r);
  const firstDate = item.first_date;
  const today = formatDate(new Date());
  const result = [];

  for (let i = 0; i < EBB_INTERVALS.length; i++) {
    const interval = EBB_INTERVALS[i];
    const prevInterval = i > 0 ? EBB_INTERVALS[i - 1] : 0;
    const prevReview = i > 0 ? reviews.find(r => r.day === EBB_INTERVALS[i - 1]) : null;

    let scheduled;
    if (i === 0) {
      const d = new Date(firstDate);
      d.setDate(d.getDate() + interval);
      scheduled = formatDate(d);
    } else if (prevReview) {
      const d = new Date(prevReview.date);
      d.setDate(d.getDate() + (interval - prevInterval));
      scheduled = formatDate(d);
    } else {
      const d = new Date(firstDate);
      d.setDate(d.getDate() + interval);
      scheduled = formatDate(d);
    }

    // 逾期自动后延到今日
    if (scheduled < today) scheduled = today;

    result.push({
      day: interval,
      scheduled,
      done: !!reviews.find(r => r.day === interval)
    });
  }
  return result;
}

function renderEbb() {
  const container = document.getElementById('panelEbb');
  if (cachedEbbItems.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无背诵内容</p></div>';
    return;
  }

  const today = formatDate(new Date());
  const headerCols = EBB_INTERVALS.map((d, i) => `<th title="第${d}天">${i+1}<br><small>d${d}</small></th>`).join('');

  container.innerHTML = `
    <div class="ebb-toolbar">
      <span style="font-size:12px;color:#888;">学习后第 1、2、4、7、15、30 天各复习一次；基于上次实际完成时间动态推进，逾期自动顺延至今日</span>
    </div>
    <div class="ebb-wrap" style="max-height:calc(100vh - 200px);overflow:auto;">
      <table class="ebb-table" style="min-width:720px;">
        <thead><tr><th style="width:120px;">内容</th><th style="width:80px;">学习日</th>${headerCols}<th style="width:60px;"></th></tr></thead>
        <tbody>
        ${cachedEbbItems.map(item => {
          const schedule = getEbbDynamicSchedule(item);
          return `<tr>
            <td class="eb-name" title="${escapeHtml(item.name)}" ondblclick="editEbbInline(${item.id})">${escapeHtml(item.name)}</td>
            <td class="eb-date">${item.first_date}</td>
            ${schedule.map(slot => {
              if (slot.done) {
                return `<td class="ebb-done"><div style="font-size:11px;color:#27ae60;">✓ ${slot.scheduled.slice(5)}</div></td>`;
              }
              const isFuture = slot.scheduled > today;
              if (isFuture) {
                return `<td><div style="font-size:11px;color:#bbb;">${slot.scheduled.slice(5)}</div></td>`;
              }
              const isToday = slot.scheduled === today;
              return `<td class="${isToday ? 'ebb-due' : ''}">
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
                  <span style="font-size:11px;color:#e74c3c;font-weight:600;">${slot.scheduled.slice(5)}</span>
                  <button onclick="toggleEbbReview(${item.id}, ${slot.day})"
                    style="font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;
                    background:#fdeaea;color:#e74c3c;border:1px solid #e74c3c;">
                    已背
                  </button>
                </div></td>`;
            }).join('')}
            <td><div class="ebb-actions"><button onclick="showEbbModal(${item.id}, '${escapeHtml(item.name).replace(/'/g, "\\'")}', '${item.first_date}')">编辑</button><button class="eb-del" onclick="deleteEbbItem(${item.id})">删除</button></div></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;
}

    <div class="tl-toolbar" style="justify-content:space-between;">
      <div style="display:flex;gap:8px;align-items:center;">
        <button onclick="setTlView('gantt')" style="padding:6px 14px;border-radius:6px;border:1px solid #d9d9d9;cursor:pointer;font-size:12px;${tlViewMode==='gantt'?'background:#4a90d9;color:#fff;border-color:#4a90d9':'background:#fff;color:#333'}">甘特图</button>
        <button onclick="setTlView('calendar')" style="padding:6px 14px;border-radius:6px;border:1px solid #d9d9d9;cursor:pointer;font-size:12px;${tlViewMode==='calendar'?'background:#4a90d9;color:#fff;border-color:#4a90d9':'background:#fff;color:#333'}">月历</button>
      </div>
      ${tlViewMode === 'gantt' ? `<div><button class="tl-nav" onclick="moveTimeline(-1)">◀ 前两周</button>
        <span style="font-size:12px;color:#888;margin:0 8px;">${tlRangeStart} ~ ${tlRangeEnd}</span>
        <button class="tl-nav" onclick="moveTimeline(1)">后两周 ▶</button></div>` : ''}
    </div>`;

  if (tlViewMode === 'calendar') {
    container.innerHTML = viewToggle + renderCalendar();
    return;
  }

  // ---- Gantt view ----
  if (!tlRangeStart) {
    const s = new Date(); s.setDate(s.getDate() - 7); tlRangeStart = formatDate(s);
    const e = new Date(); e.setDate(e.getDate() + 35); tlRangeEnd = formatDate(e);
  }

  const startD = new Date(tlRangeStart);
  const endD = new Date(tlRangeEnd);
  const dayCount = Math.round((endD - startD) / 86400000) + 1;

  const dayHeaders = [];
  for (let i = 0; i < dayCount; i++) {
    const d = new Date(startD);
    d.setDate(d.getDate() + i);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = formatDate(d) === today;
    dayHeaders.push(`<div class="tl-day${isToday ? ' today' : ''}${isWeekend ? ' weekend' : ''}" style="${isToday ? 'font-weight:700;color:#e74c3c' : ''}">
      ${d.getMonth()+1}/${d.getDate()}
    </div>`);
  }
  const daySlots = '<div class="tl-day-slot"></div>'.repeat(dayCount);

  const subjects = ['数学', '专业课', '英语', '政治'];
  const todayIdx = Math.round((new Date(today) - startD) / 86400000);
  const todayPct = (todayIdx / dayCount) * 100;

  container.innerHTML = viewToggle + `
    <div class="tl-legend">
      ${subjects.map(s => `<span><span class="tl-l-dot" style="background:${SUBJECT_COLORS[s]}"></span>${s}</span>`).join('')}
    </div>
    <div class="tl-wrap">
      <div class="tl-inner">
        <div class="tl-header">
          <div class="tl-label-col">科目</div>
          <div class="tl-days">${dayHeaders.join('')}</div>
        </div>
        ${subjects.map(subj => {
          const events = cachedTimeline.filter(e => e.subject === subj);
          return `<div class="tl-row">
            <div class="tl-row-label">${subj}</div>
            <div class="tl-row-track">
              ${daySlots}
              ${todayIdx >= 0 && todayIdx < dayCount ? `<div class="tl-today-line" style="left:${todayPct}%"></div>` : ''}
              ${events.map(ev => {
                const evStart = new Date(ev.start_date);
                const evEnd = new Date(ev.end_date);
                const startIdx = Math.round((evStart - startD) / 86400000);
                const endIdx = Math.round((evEnd - startD) / 86400000);
                if (endIdx < 0 || startIdx >= dayCount) return '';
                const left = Math.max(0, (startIdx / dayCount) * 100);
                const width = Math.max(2, ((Math.min(endIdx, dayCount - 1) - Math.max(startIdx, 0) + 1) / dayCount) * 100);
                const grad = SUBJECT_GRADIENTS[subj] || `linear-gradient(135deg, ${SUBJECT_COLORS[subj]}, ${SUBJECT_COLORS[subj]})`;
                return `<div class="tl-event" style="left:${left}%;width:${width}%;background:${grad}" onclick="showTlModal(${ev.id}, '${ev.subject}', '${escapeHtml(ev.label).replace(/'/g, "\\'")}', '${ev.start_date}', '${ev.end_date}')">
                  ${escapeHtml(ev.label)}
                  <span class="tl-del" onclick="event.stopPropagation();deleteTlEvent(${ev.id})">×</span>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderCalendar() {
  const months = [
    { name: '7月', start: new Date(2026, 6, 1), days: 31 },
    { name: '8月', start: new Date(2026, 7, 1), days: 31 },
    { name: '9月', start: new Date(2026, 8, 1), days: 30 },
    { name: '10月', start: new Date(2026, 9, 1), days: 31 },
    { name: '11月', start: new Date(2026, 10, 1), days: 30 },
    { name: '12月', start: new Date(2026, 11, 1), days: 31 },
  ];
  const today = formatDate(new Date());
  const subjects = ['数学', '专业课', '英语', '政治'];

  return `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
      ${months.map(m => {
        const startDow = m.start.getDay(); // 0=Sun
        const todayMonth = 2026 + '-' + String(m.start.getMonth() + 1).padStart(2, '0');

        // Gather events for this month
        const monthDates = [];
        for (let d = 1; d <= m.days; d++) {
          const ds = todayMonth + '-' + String(d).padStart(2, '0');
          const events = cachedTimeline.filter(ev => ev.end_date === ds);
          const impDate = IMPORTANT_DATES.find(id => id.date === ds);
          monthDates.push({ day: d, date: ds, events, impDate });
        }

        // Get the day key for today
        const todayKey = today;

        return `<div style="background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);">
          <div style="font-weight:700;font-size:14px;text-align:center;padding:4px 0 8px;color:#333;">${m.name}</div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px;text-align:center;color:#999;margin-bottom:2px;">
            ${['日','一','二','三','四','五','六'].map(d => `<div>${d}</div>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;">
            ${'<div></div>'.repeat(startDow)}
            ${monthDates.map(md => {
              const isToday = md.date === todayKey;
              const hasEvents = md.events.length > 0;
              const hasImp = md.impDate;
              let bg = '';
              let textColor = '';
              if (isToday) { bg = 'background:#e74c3c;'; textColor = 'color:#fff;font-weight:700;'; }
              else if (hasImp) { bg = 'background:' + md.impDate.color + ';'; textColor = 'color:#fff;'; }
              else if (hasEvents) bg = 'background:#f0f6ff;';
              return `<div style="position:relative;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;cursor:${hasImp?'pointer':'default'};${bg}${textColor}" title="${md.date}${md.impDate?' · '+md.impDate.label:''}${hasEvents?' · '+md.events.map(e=>e.label).join(', '):''}">
                <span style="font-size:10px;line-height:1;">${md.day}</span>
                ${hasImp ? `<span style="font-size:7px;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${md.impDate.icon}</span>` : ''}
                ${hasEvents ? md.events.slice(0,2).map(e => `<span style="font-size:7px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${textColor ? '#fff' : (e.color || SUBJECT_COLORS[e.subject])};">${escapeHtml(e.label)}</span>`).join('') : ''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:#888;">
      <span>重要节点：</span>
      ${IMPORTANT_DATES.map(d => `<span style="display:flex;align-items:center;gap:3px;"><span style="width:8px;height:8px;border-radius:50%;background:${d.color};display:inline-block;"></span>${d.date} ${d.icon} ${d.label}</span>`).join('')}
    </div>`;
}

// ==================== 弹窗遮罩点击关闭 ====================
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});
document.getElementById('imgPreview').addEventListener('click', (e) => {
  if (e.target === e.currentTarget || e.target.tagName === 'IMG') closeImgPreview();
});

// ==================== 启动 ====================
(async function init() {
  await loadAllData();
  await refreshSidebar();
})();
</script>
</body>
