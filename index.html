<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>错题集（按知识点分类）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📖</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #f0f2f5;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.app-layout {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.sidebar-overlay { display: none; }
.sidebar {
  width: 280px;
  min-width: 280px;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 8px rgba(0,0,0,.05);
}
.body-row {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid #eee;
}
.sidebar-header h1 { font-size: 18px; color: #1a1a2e; margin-bottom: 4px; }
.sidebar-header .subtitle { font-size: 12px; color: #999; }

.sidebar-actions {
  padding: 10px 12px;
  border-bottom: 1px solid #eee;
  display: flex;
  gap: 6px;
}
.sidebar-actions button {
  flex: 1;
  padding: 9px 8px;
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: #333;
  transition: all .2s;
  white-space: nowrap;
}
.sidebar-actions button:hover { border-color: #4a90d9; color: #4a90d9; }
.sidebar-actions button:active { background: #e8f0fe; }

.sidebar-tree {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
  -webkit-overflow-scrolling: touch;
}

.tree-chapter { margin-bottom: 1px; }
.chapter-header {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  cursor: pointer;
  transition: background .15s;
  gap: 6px;
  position: relative;
}
.chapter-header:hover { background: #f5f7fa; }
.chapter-header.active { background: #e8f0fe; color: #4a90d9; }
.chapter-header .icon { font-size: 15px; flex-shrink: 0; }
.chapter-header .name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chapter-header .count {
  font-size: 11px;
  color: #999;
  background: #f0f0f0;
  padding: 1px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}
.chapter-header .del-chapter {
  font-size: 18px;
  color: #ccc;
  cursor: pointer;
  padding: 4px 6px;
  display: none;
  border: none;
  background: none;
  line-height: 1;
  flex-shrink: 0;
}
.chapter-header:hover .del-chapter { display: block; }
.chapter-header .del-chapter:hover { color: #e74c3c; }
.edit-btn {
  font-size: 12px;
  color: #bbb;
  cursor: pointer;
  padding: 0 4px;
  border: none;
  background: none;
  opacity: 0;
  transition: opacity .15s;
  vertical-align: middle;
}
.chapter-header:hover .edit-btn,
.kp-item:hover .edit-btn { opacity: 1; }
.edit-btn:hover { color: #4a90d9; }
.kp-edit-btn { font-size: 10px; }

.kp-list { display: none; }
.kp-list.open { display: block; }
.kp-item {
  display: flex;
  align-items: center;
  padding: 9px 14px 9px 38px;
  cursor: pointer;
  font-size: 13px;
  color: #555;
  gap: 6px;
  transition: background .15s;
}
.kp-item:hover { background: #f5f7fa; }
.kp-item.active { background: #e8f0fe; color: #4a90d9; font-weight: 600; }
.kp-item .kp-dot { font-size: 5px; color: #bbb; flex-shrink: 0; }
.kp-item .kp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kp-item .kp-count {
  font-size: 11px;
  color: #999;
  background: #f0f0f0;
  padding: 1px 7px;
  border-radius: 10px;
  flex-shrink: 0;
}
.kp-item .del-kp {
  font-size: 16px;
  color: #ccc;
  cursor: pointer;
  padding: 2px 4px;
  display: none;
  border: none;
  background: none;
  line-height: 1;
  flex-shrink: 0;
}
.kp-item:hover .del-kp { display: block; }
.kp-item .del-kp:hover { color: #e74c3c; }

/* ---- 拖拽排序 ---- */
.chapter-header { cursor: grab; }
.chapter-header:active { cursor: grabbing; }
.kp-item { cursor: grab; }
.kp-item:active { cursor: grabbing; }
.dragging { opacity: 0.4; }
.drag-over-chapter { background: #e8f0fe !important; outline: 2px dashed #4a90d9; outline-offset: -2px; }
.drag-over-kp { background: #e8f0fe !important; outline: 2px dashed #4a90d9; outline-offset: -2px; }
.drag-handle {
  display: inline-block;
  color: #ccc;
  cursor: grab;
  font-size: 14px;
  padding: 0 2px;
  line-height: 1;
  flex-shrink: 0;
  user-select: none;
}
.kp-move-btn {
  font-size: 12px;
  color: #bbb;
  cursor: pointer;
  padding: 2px 5px;
  border: none;
  background: none;
  display: none;
  flex-shrink: 0;
}
.kp-item:hover .kp-move-btn { display: block; }
.kp-move-btn:hover { color: #e67e22; }

/* ---- Tab Navigation ---- */
.tab-nav {
  display: flex;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  gap: 0;
  position: relative;
  z-index: 601;
}
.tab-nav button {
  flex: 1;
  padding: 12px 4px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #999;
  border-bottom: 2px solid transparent;
  transition: all .2s;
  position: relative;
}
.tab-nav button.active { color: #4a90d9; border-bottom-color: #4a90d9; }
.tab-nav button:active { background: #f5f7fa; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f0f2f5;
  overflow: hidden;
}
.main-header {
  padding: 14px 20px;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 10;
}
.main-header .menu-btn {
  display: none;
  font-size: 22px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: #333;
  line-height: 1;
}
.main-header .breadcrumb {
  font-size: 14px;
  color: #333;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.main-header .breadcrumb span { color: #999; font-weight: normal; }
.main-header .add-btn {
  padding: 9px 18px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.main-header .add-btn:active { background: #3a7bc8; }
.main-header .add-btn:disabled {
  background: #c0c0c0;
  cursor: not-allowed;
  opacity: .7;
}

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #bbb;
}
.empty-state .empty-icon { font-size: 52px; margin-bottom: 14px; }
.empty-state p { font-size: 14px; line-height: 1.8; }

.question-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.question-card {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  display: flex;
  flex-direction: column;
  cursor: grab;
  user-select: auto;
  -webkit-user-select: auto;
}
.question-card:active { cursor: grabbing; }
.card-img-wrap {
  width: 100%;
  height: 100px;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  border-bottom: 1px solid #eee;
}
.card-img-wrap img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  -webkit-user-drag: none;
  user-drag: none;
}
.card-info { padding: 12px 14px; }
.card-date {
  font-size: 12px;
  color: #999;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.progress-section { margin-bottom: 6px; }
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.progress-header .review-label { font-size: 12px; color: #666; }
.progress-header .review-count { font-size: 12px; font-weight: 600; color: #4a90d9; }
.progress-bar-wrap {
  width: 100%;
  height: 8px;
  background: #e8e8e8;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4a90d9, #5ba0e8);
  border-radius: 4px;
  transition: width .3s ease;
}
.progress-bar-fill.full { background: linear-gradient(90deg, #27ae60, #2ecc71); }
.review-dates {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
  min-height: 20px;
}
.review-date-tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
}
.review-date-tag.tag-correct {
  background: #e6f9ed;
  color: #27ae60;
}
.review-date-tag.tag-wrong {
  background: #fdeaea;
  color: #e74c3c;
}
.card-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  background: #27ae60;
  color: #fff;
  border-radius: 4px;
  margin-bottom: 4px;
}
.card-actions {
  display: flex;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid #f0f0f0;
}
.card-actions button {
  flex: 1;
  padding: 8px 0;
  border: 1px solid #d9d9d9;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
  -webkit-tap-highlight-color: transparent;
}
.card-actions .btn-correct {
  border-color: #27ae60;
  color: #27ae60;
  font-weight: 500;
}
.card-actions .btn-correct:active { background: #27ae60; color: #fff; }
.card-actions .btn-wrong {
  border-color: #e74c3c;
  color: #e74c3c;
  font-weight: 500;
}
.card-actions .btn-wrong:active { background: #e74c3c; color: #fff; }
.card-actions .btn-delete {
  border-color: #bbb;
  color: #999;
  font-size: 12px;
  flex: 0.6;
}
.card-actions .btn-delete:active { background: #e74c3c; color: #fff; }

/* ---- Ebbinghaus ---- */
.ebb-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  font-size: 13px;
}
.ebb-table thead th {
  background: #f5f7fa;
  padding: 10px 6px;
  font-weight: 600;
  color: #555;
  border-bottom: 1px solid #eee;
  text-align: center;
  white-space: nowrap;
  font-size: 12px;
}
.ebb-table tbody td {
  padding: 10px 6px;
  text-align: center;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.ebb-table .eb-name { text-align: left; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ebb-table .eb-date { font-size: 12px; color: #888; white-space: nowrap; }
.ebb-chk {
  width: 18px; height: 18px;
  cursor: pointer;
  accent-color: #4a90d9;
}
.ebb-chk:disabled { opacity: .4; cursor: not-allowed; }
.ebb-future { color: #ccc; font-size: 11px; }
.ebb-done { background: #e6f9ed; }
.ebb-due { background: #fff8e1; }
.ebb-head-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.ebb-head-actions button {
  padding: 8px 14px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.ebb-head-actions button:active { background: #3a7bc8; }
.ebb-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.ebb-actions { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.ebb-actions button {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid #d9d9d9;
  background: #fff;
  cursor: pointer;
  color: #666;
}
.ebb-actions button:active { background: #eee; }
.ebb-actions .eb-del { color: #e74c3c; border-color: #f5c6cb; }
.ebb-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
@media (max-width:768px) {
  .ebb-table { font-size: 11px; }
  .ebb-table thead th { padding: 8px 3px; font-size: 10px; }
  .ebb-table tbody td { padding: 8px 3px; }
  .ebb-table .eb-name { max-width: 80px; }
}

/* ---- Timeline ---- */
.tl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; cursor: grab; }
.tl-wrap.dragging { cursor: grabbing; user-select: none; }
.tl-inner { min-width: 600px; }
.tl-header {
  display: flex;
  border-bottom: 1px solid #e0e0e0;
  background: #f5f7fa;
  border-radius: 8px 8px 0 0;
}
.tl-label-col {
  width: 70px; min-width: 70px;
  padding: 10px 8px;
  font-weight: 600;
  color: #888;
  font-size: 12px;
  text-align: center;
  border-right: 1px solid #e0e0e0;
}
.tl-days {
  flex: 1;
  display: flex;
}
.tl-day {
  flex: 1;
  min-width: 28px;
  padding: 8px 0;
  text-align: center;
  font-size: 10px;
  color: #999;
  border-right: 1px solid #f0f0f0;
}
.tl-day.weekend { color: #e74c3c; }
.tl-row {
  display: flex;
  border-bottom: 1px solid #f0f0f0;
  background: #fff;
  position: relative;
  min-height: 44px;
}
.tl-row-label {
  width: 70px; min-width: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 13px;
  color: #333;
  border-right: 1px solid #e0e0e0;
  padding: 4px;
}
.tl-row-track {
  flex: 1;
  display: flex;
  position: relative;
  min-height: 44px;
}
.tl-day-slot {
  flex: 1;
  min-width: 28px;
  border-right: 1px solid #f8f8f8;
  position: relative;
}
.tl-event {
  position: absolute;
  top: 4px;
  height: 36px;
  border-radius: 4px;
  padding: 0 8px;
  font-size: 11px;
  color: #fff;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: pointer;
  z-index: 2;
  transition: opacity .2s, box-shadow .2s;
  box-shadow: 0 2px 4px rgba(0,0,0,.15);
}
.tl-event:hover { opacity: .85; box-shadow: 0 4px 8px rgba(0,0,0,.25); }
.tl-event .tl-del {
  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  cursor: pointer;
  opacity: 0;
  padding: 2px 4px;
  background: rgba(0,0,0,.3);
  border-radius: 3px;
}
.tl-event:hover .tl-del { opacity: 1; }
.schedule-table td:hover .slot-del { display: block !important; }
.schedule-scroll { cursor: grab; }
.schedule-scroll.dragging { cursor: grabbing; user-select: none; }
.tl-today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #e74c3c;
  z-index: 3;
  pointer-events: none;
}
.tl-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.tl-toolbar button {
  padding: 8px 14px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.tl-toolbar button:active { background: #3a7bc8; }
.tl-legend {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 11px;
  color: #888;
  align-items: center;
}
.tl-legend span { display: flex; align-items: center; gap: 3px; }
.tl-l-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---- 弹窗 ---- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 24px 20px;
  width: 400px;
  max-width: 100%;
  box-shadow: 0 8px 40px rgba(0,0,0,.15);
}
.modal h3 { font-size: 16px; margin-bottom: 18px; color: #1a1a2e; }
.modal .form-group { margin-bottom: 14px; }
.modal .form-group label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
  font-weight: 600;
}
.modal .form-group input[type="text"],
.modal .form-group input[type="date"],
.modal .form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
  background: #fff;
  -webkit-appearance: none;
}
.modal .form-group input:focus,
.modal .form-group select:focus { border-color: #4a90d9; }

.modal .image-upload-area {
  width: 100%;
  height: 150px;
  border: 2px dashed #d9d9d9;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  overflow: hidden;
  position: relative;
}
.modal .image-upload-area:active { background: #f8fafe; border-color: #4a90d9; }
.modal .image-upload-area.has-image { border-style: solid; }
.modal .image-upload-area img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.modal .image-upload-area .placeholder { color: #bbb; font-size: 13px; text-align: center; }
.modal .image-upload-area .placeholder .upload-icon { font-size: 30px; display: block; margin-bottom: 4px; }
.modal .image-upload-area input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.modal .modal-btns {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.modal .modal-btns button {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  border: none;
  transition: opacity .2s;
}
.modal .modal-btns button:active { opacity: .8; }
.modal .btn-cancel { background: #f0f0f0; color: #666; }
.modal .btn-confirm { background: #4a90d9; color: #fff; }

.img-preview-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.9);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
.img-preview-overlay.show { display: flex; }
.img-preview-overlay img {
  max-width: 92vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 4px;
}

.toast {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  color: #fff;
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 3000;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: #aaa;
  gap: 10px;
  font-size: 13px;
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid #e0e0e0;
  border-top-color: #4a90d9;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.conn-status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: #27ae60;
  background: #fff;
  padding: 4px 12px;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ==================== Supabase ====================
const supabaseUrl = 'https://owuckenvwmdsithqvsod.supabase.co';
const supabaseKey = 'sb_publishable_2Ccd-_BuUgE2RJ35YKyhBA_XhysffVW';
const sb = supabase.createClient(supabaseUrl, supabaseKey);

// ==================== 艾宾浩斯间隔 ====================
const EBB_INTERVALS = [1, 2, 4, 7, 15, 30];
const EBB_LABELS_EN = { 1: '拼写', 2: '用法', 4: '综合缩词', 7: '缩词' };

// ==================== 侧边栏 ====================
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
}

// ==================== 全局状态 ====================
let currentTab = 'cuoti';
let selectedChapterId = null;
let selectedKpId = null;
let selectedCoreChapterId = null;
let selectedImageData = null;
let cachedChapters = [];
let cachedKps = [];
let cachedQuestions = [];
let cachedEbbItems = [];
let cachedTimeline = [];
let ebbLoaded = false;
let tlLoaded = false;
let ebbSubject = '专业课';
let cachedCoreQuestions = [];
let coreLoaded = false;
let cachedSchedule = [];
let scheduleTimeSlots = [];
let scheduleLoaded = false;
let scheduleDateRange = { start: '', end: '' };

// ==================== Tab 切换 ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel' + tab.charAt(0).toUpperCase() + tab.slice(1)));

  const addBtn = document.getElementById('addBtn');
  const breadcrumb = document.getElementById('breadcrumb');
  const appLayout = document.querySelector('.app-layout');

  if (tab === 'cuoti') {
    appLayout.classList.remove('not-cuoti');
    closeSidebar();
    addBtn.textContent = '+ 错题';
    addBtn.disabled = !selectedKpId && !selectedCoreChapterId;
    if (selectedCoreChapterId) {
      const ch = cachedChapters.find(c => c.id == selectedCoreChapterId);
      breadcrumb.innerHTML = '★ 重要例题 <span>&gt;</span> ' + escapeHtml(ch?.name || '');
      addBtn.textContent = '+ 重要例题';
      addBtn.disabled = false;
    } else {
      breadcrumb.innerHTML = selectedKpId ? getBreadcrumbHtml() : '<span>选择知识点查看错题</span>';
    }
    refreshMainContent();
  } else if (tab === 'ebb') {
    appLayout.classList.add('not-cuoti');
    closeSidebar();
    addBtn.textContent = '+ 背诵项';
    addBtn.disabled = false;
    breadcrumb.textContent = '艾宾浩斯遗忘表';
    if (!ebbLoaded) { reloadEbb().then(() => { ebbLoaded = true; renderEbb(); }); }
    else renderEbb();
  } else if (tab === 'timeline') {
    appLayout.classList.add('not-cuoti');
    closeSidebar();
    addBtn.textContent = '+ 任务';
    addBtn.disabled = false;
    breadcrumb.textContent = '考研进度时间表';
    if (!tlLoaded) { Promise.all([reloadTimelineData(), reloadTimeSlots().catch(() => {})]).then(() => { tlLoaded = true; renderTimeline(); }); }
    else renderTimeline();
  }
}

function handleAddBtn() {
  if (currentTab === 'cuoti') showQuestionModal();
  else if (currentTab === 'ebb') showEbbModal();
  else if (currentTab === 'timeline') showTlModal();
}

function getBreadcrumbHtml() {
  const kp = cachedKps.find(k => k.id == selectedKpId);
  const ch = cachedChapters.find(c => c.id == (kp?.chapter_id));
  return escapeHtml(ch?.name || '') + ' <span>&gt;</span> ' + escapeHtml(kp?.name || '');
}

// ==================== Toast ====================
let _toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== 弹窗通用 ====================
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  if (id === 'questionModal') {
    selectedImageData = null;
    document.getElementById('imageFileInput').value = '';
    const area = document.getElementById('imageUploadArea');
    area.classList.remove('has-image');
    area.querySelector('img')?.remove();
    area.querySelector('.placeholder').style.display = '';
  }
  if (id === 'chapterModal') {
    document.getElementById('chapterNameInput').value = '';
    document.getElementById('editChapterId').value = '';
    document.getElementById('chapterModalTitle').textContent = '添加章节';
  }
  if (id === 'kpModal') {
    document.getElementById('kpNameInput').value = '';
    document.getElementById('editKpId').value = '';
  }
  if (id === 'ebbModal') {
    document.getElementById('ebbNameInput').value = '';
    document.getElementById('editEbbId').value = '';
  }
  if (id === 'tlModal') {
    document.getElementById('tlLabelInput').value = '';
    document.getElementById('editTlId').value = '';
  }
  if (id === 'coreQuestionModal') {
    selectedImageData = null;
    document.getElementById('coreImageFileInput').value = '';
    const area = document.getElementById('coreImageUploadArea');
    area.classList.remove('has-image');
    area.querySelector('img')?.remove();
    area.querySelector('.placeholder').style.display = '';
  }
}

// ==================== 章节弹窗 ====================
function showChapterModal(chapterId, currentName) {
  if (chapterId) {
    document.getElementById('chapterModalTitle').textContent = '编辑章节';
    document.getElementById('chapterNameInput').value = currentName;
    document.getElementById('editChapterId').value = chapterId;
  } else {
    document.getElementById('chapterModalTitle').textContent = '添加章节';
    document.getElementById('chapterNameInput').value = '';
    document.getElementById('editChapterId').value = '';
  }
  openModal('chapterModal');
  setTimeout(() => document.getElementById('chapterNameInput').focus(), 100);
}

async function showKpModal() {
  if (cachedChapters.length === 0) { showToast('请先添加章节'); return; }
  const sel = document.getElementById('kpChapterSelect');
  sel.innerHTML = cachedChapters.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  document.getElementById('kpNameInput').value = '';
  document.getElementById('editKpId').value = '';
  openModal('kpModal');
  setTimeout(() => document.getElementById('kpNameInput').focus(), 100);
}

function showKpEditModal(kpId, currentName, chapterId) {
  const sel = document.getElementById('kpChapterSelect');
  sel.innerHTML = cachedChapters.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  sel.value = chapterId;
  document.getElementById('kpNameInput').value = currentName;
  document.getElementById('editKpId').value = kpId;
  openModal('kpModal');
  setTimeout(() => { document.getElementById('kpNameInput').focus(); document.getElementById('kpNameInput').select(); }, 100);
}

async function showQuestionModal() {
  if (!selectedKpId) { showToast('请先选择知识点'); return; }
  const sel = document.getElementById('qKpSelect');
  sel.innerHTML = cachedKps.map(kp => {
    const ch = cachedChapters.find(c => c.id == kp.chapter_id);
    return `<option value="${kp.id}" ${kp.id == selectedKpId ? 'selected' : ''}>
      ${ch ? ch.name + ' > ' : ''}${escapeHtml(kp.name)}
    </option>`;
  }).join('');
  selectedImageData = null;
  document.getElementById('imageFileInput').value = '';
  const area = document.getElementById('imageUploadArea');
  area.classList.remove('has-image');
  area.querySelector('img')?.remove();

function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1200, maxH = 1200;
      let w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        const ratio = Math.min(maxW / w, maxH / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      selectedImageData = canvas.toDataURL('image/jpeg', 0.85);
      const area = document.getElementById('imageUploadArea');
      area.classList.add('has-image');
      area.querySelector('.placeholder').style.display = 'none';
      let preview = area.querySelector('img');
      if (!preview) { preview = document.createElement('img'); area.appendChild(preview); }
      preview.src = selectedImageData;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ==================== IndexedDB 缓存 ====================
const DB_NAME = 'CuotijiCache';
const DB_VERSION = 2;

function openCacheDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveToCache(data) {
  try {
    const db = await openCacheDB();
    const tx = db.transaction('cache', 'readwrite');
    tx.objectStore('cache').put(data, 'data');
    await new Promise(r => { tx.oncomplete = r; });
    db.close();
  } catch (e) {}
}

async function loadFromCache() {
  try {
    const db = await openCacheDB();
    const tx = db.transaction('cache', 'readonly');
    const req = tx.objectStore('cache').get('data');
    const data = await new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return data;
  } catch (e) { return null; }
}

async function loadAllData() {
  const statusEl = document.getElementById('connStatus');
  try {
    const [cRes, kpRes, qRes] = await Promise.all([
      sb.from('chapters').select('*').order('sort_order', { ascending: true }).order('id'),
      sb.from('knowledge_points').select('*').order('sort_order', { ascending: true }).order('id'),
      sb.from('questions').select('*').order('created_at', { ascending: false })
    ]);

    if (cRes.error) throw cRes.error;
    if (kpRes.error) throw kpRes.error;
    if (qRes.error) throw qRes.error;

    cachedChapters = cRes.data || [];
    cachedKps = kpRes.data || [];
    cachedQuestions = qRes.data || [];

    await saveToCache({ chapters: cachedChapters, kps: cachedKps, questions: cachedQuestions, ebbItems: cachedEbbItems, timeline: cachedTimeline });

    statusEl.className = 'conn-status';
    statusEl.innerHTML = '<span class="dot"></span> 数据已同步';
  } catch (err) {
    console.warn('Supabase 加载失败，尝试离线缓存:', err.message);
    const cache = await loadFromCache();
    if (cache) {
      cachedChapters = cache.chapters || [];
      cachedKps = cache.kps || [];
      cachedQuestions = cache.questions || [];
      cachedEbbItems = cache.ebbItems || [];
      cachedTimeline = cache.timeline || [];
      statusEl.className = 'conn-status warn';
      statusEl.innerHTML = '<span class="dot"></span> 离线模式（上次缓存）';
    } else {
      statusEl.className = 'conn-status error';
      statusEl.innerHTML = '<span class="dot"></span> 无数据，请检查网络';
    }
  }
}

// ==================== 拖拽排序 ====================
let dragData = null; // { type: 'chapter'|'kp'|'question'|'core', id, chapterId?, parentId? }

function onDragStart(e, type, id, chapterId, parentId) {
  dragData = { type, id, chapterId, parentId };
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
}

function onDragOverChapter(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over-chapter');
}
function onDragLeaveChapter(e) {
  e.currentTarget.classList.remove('drag-over-chapter');
}
async function onDropChapter(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over-chapter');
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  if (!dragData || dragData.type !== 'chapter') { dragData = null; return; }
  if (dragData.id === targetId) { dragData = null; return; }
  await swapChapterOrder(dragData.id, targetId);
  dragData = null;
}

function onDragOverKp(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over-kp');
}
function onDragLeaveKp(e) {
  e.currentTarget.classList.remove('drag-over-kp');
}
async function onDropKp(e, targetId, targetChapterId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over-kp');
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  if (!dragData || dragData.type !== 'kp') { dragData = null; return; }
  if (dragData.id === targetId) { dragData = null; return; }
  // Only reorder within same chapter
  if (dragData.chapterId !== targetChapterId) { dragData = null; return; }
  await swapKpOrder(dragData.id, targetId, targetChapterId);
  dragData = null;
}

async function swapChapterOrder(id1, id2) {
  const a = cachedChapters.find(c => c.id == id1);
  const b = cachedChapters.find(c => c.id == id2);
  if (!a || !b) return;
  // Optimistic: swap sort_order in cache
  const tmp = a.sort_order;
  a.sort_order = b.sort_order;
  b.sort_order = tmp;
  // Swap in DOM (sidebar tree)
  const elA = document.querySelector(`.tree-chapter[data-id="${id1}"]`);
  const elB = document.querySelector(`.tree-chapter[data-id="${id2}"]`);
  if (elA && elB && elA.parentNode === elB.parentNode) {
    const nextA = elA.nextSibling === elB ? elA : elA.nextSibling;
    elB.parentNode.insertBefore(elA, elB);
    elB.parentNode.insertBefore(elB, nextA);
  }
  // Fire API in background
  sb.from('chapters').update({ sort_order: b.sort_order }).eq('id', a.id).then(() => {
    return sb.from('chapters').update({ sort_order: a.sort_order }).eq('id', b.id);
  }).catch(err => showToast('排序保存失败: ' + err.message));
}

async function swapKpOrder(id1, id2, chapterId) {
  const childKps = cachedKps.filter(kp => kp.chapter_id == chapterId);
  const a = childKps.find(kp => kp.id == id1);
  const b = childKps.find(kp => kp.id == id2);
  if (!a || !b) return;
  // Optimistic: swap sort_order in cache
  const tmp = a.sort_order;
  a.sort_order = b.sort_order;
  b.sort_order = tmp;
  // Swap in DOM
  const elA = document.querySelector(`.kp-item[data-id="${id1}"]`);
  const elB = document.querySelector(`.kp-item[data-id="${id2}"]`);
  if (elA && elB && elA.parentNode === elB.parentNode) {
    const nextA = elA.nextSibling === elB ? elA : elA.nextSibling;
    elB.parentNode.insertBefore(elA, elB);
    elB.parentNode.insertBefore(elB, nextA);
  }
  // Fire API in background
  sb.from('knowledge_points').update({ sort_order: b.sort_order }).eq('id', a.id).then(() => {
    return sb.from('knowledge_points').update({ sort_order: a.sort_order }).eq('id', b.id);
  }).catch(err => showToast('排序保存失败: ' + err.message));
}

// ---- Card drag handlers (错题 + 重要例题) ----
function onDragOverCard(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over-kp');
}
function onDragLeaveCard(e) {
  e.currentTarget.classList.remove('drag-over-kp');
}
async function onDropCard(e, targetId, targetType, targetParentId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over-kp');
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  if (!dragData || dragData.type !== targetType) { dragData = null; return; }
  if (dragData.id === targetId) { dragData = null; return; }
  // Only reorder within same parent
  if (dragData.parentId !== targetParentId) { dragData = null; return; }
  if (targetType === 'question') {
    await swapQuestionOrder(dragData.id, targetId, targetParentId);
  } else if (targetType === 'core') {
    await swapCoreQOrder(dragData.id, targetId, targetParentId);
  }
  dragData = null;
}

function swapDomCards(id1, id2) {
  const elA = document.querySelector(`.question-card[data-id="${id1}"]`);
  const elB = document.querySelector(`.question-card[data-id="${id2}"]`);
  if (!elA || !elB || elA.parentNode !== elB.parentNode) return;
  const nextA = elA.nextSibling === elB ? elA : elA.nextSibling;
  elB.parentNode.insertBefore(elA, elB);
  elB.parentNode.insertBefore(elB, nextA);
}

function swapSortOrderInList(list, id1, id2) {
  const a = list.find(it => it.id == id1);
  const b = list.find(it => it.id == id2);
  if (!a || !b) return;
  const tmp = a.sort_order;
  a.sort_order = b.sort_order;
  b.sort_order = tmp;
}

async function swapQuestionOrder(id1, id2, kpId) {
  const list = cachedQuestions.filter(q => q.knowledge_point_id == kpId);
  if (!list.find(q => q.id == id1) || !list.find(q => q.id == id2)) return;
  // Optimistic: instant DOM swap
  swapDomCards(id1, id2);
  swapSortOrderInList(list, id1, id2);
  const a = list.find(q => q.id == id1);
  const b = list.find(q => q.id == id2);
  // Fire API in background
  sb.from('questions').update({ sort_order: (b.sort_order || b.id) }).eq('id', a.id).then(() => {
    return sb.from('questions').update({ sort_order: (a.sort_order || a.id) }).eq('id', b.id);
  }).catch(err => showToast('排序保存失败: ' + err.message));
}

async function swapCoreQOrder(id1, id2, chapterId) {
  const list = cachedCoreQuestions.filter(q => q.chapter_id == chapterId);
  if (!list.find(q => q.id == id1) || !list.find(q => q.id == id2)) {
    showToast('排序失败：未找到对应例题记录，请刷新后重试');
    return;
  }
  // Optimistic: instant DOM swap
  swapDomCards(id1, id2);
  swapSortOrderInList(list, id1, id2);
  const a = list.find(q => q.id == id1);
  const b = list.find(q => q.id == id2);
  // Fire API in background
  sb.from('core_questions').update({ sort_order: (b.sort_order || b.id) }).eq('id', a.id).then(() => {
    return sb.from('core_questions').update({ sort_order: (a.sort_order || a.id) }).eq('id', b.id);
  }).catch(err => showToast('排序保存失败: ' + err.message));
}

// ---- 错题迁移到其他知识点 ----
async function moveQuestionToKp(qId, fromKpId) {
  const q = cachedQuestions.find(k => k.id == qId);
  if (!q) return;
  const allKps = cachedKps;
  if (allKps.length <= 1) { showToast('只有这一个知识点，无法转移'); return; }

  const html = allKps.map(kp => {
    const ch = cachedChapters.find(c => c.id == kp.chapter_id);
    return `<option value="${kp.id}" ${kp.id == fromKpId ? 'disabled' : ''}>
      ${escapeHtml(ch ? ch.name + ' / ' : '')}${escapeHtml(kp.name)}${kp.id == fromKpId ? '（当前）' : ''}
    </option>`;
  }).join('');
  const selId = 'qMoveKpSelect_' + qId;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay show';
  modal.innerHTML = `<div class="modal">
    <h3>转移错题</h3>
    <p style="margin-bottom:12px;font-size:13px;color:#666;">将这道错题转移到其他知识点：</p>
    <div class="form-group">
      <select id="${selId}" style="width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;">${html}</select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="qMoveCancel">取消</button>
      <button class="btn-confirm" id="qMoveConfirm">转移</button>
    </div>
  </div>`;
  document.body.appendChild(modal);

  modal.querySelector('#qMoveCancel').onclick = () => modal.remove();
  modal.querySelector('#qMoveConfirm').onclick = async () => {
    const targetKpId = parseInt(modal.querySelector('#' + selId).value, 10);
    modal.remove();
    try {
      const res = await sb.from('questions').update({ knowledge_point_id: targetKpId }).eq('id', qId);
      if (res.error) throw res.error;
      await reloadQuestions();
      await refreshMainContent();
      await refreshSidebar();
      const targetKp = cachedKps.find(k => k.id == targetKpId);
      showToast('已转移到「' + escapeHtml(targetKp?.name || '') + '」');
    } catch (err) { showToast('转移失败: ' + err.message); }
  };
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
}

// ==================== 知识点转移 ====================
async function moveKpToChapter(kpId, fromChapterId) {
  const kp = cachedKps.find(k => k.id == kpId);
  if (!kp) return;
  const otherChapters = cachedChapters.filter(c => c.id != fromChapterId);
  if (otherChapters.length === 0) { showToast('没有其他章节可转移'); return; }

  const html = otherChapters.map(c =>
    `<option value="${c.id}">${escapeHtml(c.name)}</option>`
  ).join('');
  const selId = 'kpMoveChapterSelect_' + kpId;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay show';
  modal.innerHTML = `<div class="modal">
    <h3>转移知识点</h3>
    <p style="margin-bottom:12px;font-size:13px;color:#666;">将「<b>${escapeHtml(kp.name)}</b>」及其中 <b>${cachedQuestions.filter(q => q.knowledge_point_id == kpId).length}</b> 道错题转移到：</p>
    <div class="form-group">
      <select id="${selId}" style="width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;">${html}</select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="kpMoveCancel">取消</button>
      <button class="btn-confirm" id="kpMoveConfirm">转移</button>
    </div>
  </div>`;
  document.body.appendChild(modal);

  modal.querySelector('#kpMoveCancel').onclick = () => modal.remove();
  modal.querySelector('#kpMoveConfirm').onclick = async () => {
    const targetChapterId = parseInt(modal.querySelector('#' + selId).value, 10);
    modal.remove();
    try {
      const res = await sb.from('knowledge_points').update({ chapter_id: targetChapterId }).eq('id', kpId);
      if (res.error) throw res.error;
      await reloadKps();
      if (selectedKpId == kpId) {
        selectedKpId = null;
        selectedChapterId = targetChapterId;
        updateMainHeader();
        document.getElementById('panelCuoti').innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><p>知识点已转移，请重新选择</p></div>';
      }
      await refreshSidebar();
      showToast('已转移到「' + escapeHtml(cachedChapters.find(c => c.id == targetChapterId)?.name || '') + '」');
    } catch (err) { showToast('转移失败: ' + err.message); }
  };
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
}

// ==================== 重要例题库 ====================
function selectCore(chapterId) {
  selectedCoreChapterId = chapterId;
  selectedKpId = null;
  updateMainHeader();
  openSidebar();
  refreshMainContent();
  refreshSidebar();
}

function showCoreQuestionModal(chapterId) {
  document.getElementById('coreChapterId').value = chapterId;
  document.getElementById('coreTagInput').value = '';
  selectedImageData = null;
  document.getElementById('coreImageFileInput').value = '';
  const area = document.getElementById('coreImageUploadArea');
  area.classList.remove('has-image');
  area.querySelector('img')?.remove();
  area.querySelector('.placeholder').style.display = '';
  openModal('coreQuestionModal');
}

async function saveCoreQuestion() {
  const chapterId = parseInt(document.getElementById('coreChapterId').value, 10);
  const tag = document.getElementById('coreTagInput').value.trim();
  if (!selectedImageData) { showToast('请上传题目图片'); return; }
  try {
    const res = await sb.from('core_questions').insert({ chapter_id: chapterId, image_data: selectedImageData, tag, correct_count: 0, wrong_count: 0, review_log: [] });
    if (res.error) throw res.error;
    await reloadCoreQuestions();
    closeModal('coreQuestionModal');
    await refreshSidebar();
    await refreshMainContent();
    showToast('重要例题已添加');
  } catch (err) { showToast('保存失败: ' + err.message); }
}

async function editCoreTag(id, currentTag) {
  const newTag = prompt('修改题型标签', currentTag || '');
  if (newTag === null) return;
  try {
    const res = await sb.from('core_questions').update({ tag: newTag.trim() }).eq('id', id);
    if (res.error) throw res.error;
    await reloadCoreQuestions();
    await refreshSidebar();
    showToast('标签已更新');
  } catch (err) { showToast('更新失败: ' + err.message); }
}

async function deleteCoreQuestion(id) {
  if (!confirm('确定删除该重要例题？')) return;
  try {
    await sb.from('core_questions').delete().eq('id', id);
    await reloadCoreQuestions();
    await refreshSidebar();
    await refreshMainContent();
    showToast('已删除');
  } catch (err) { showToast('删除失败: ' + err.message); }
}

async function markCoreCorrect(id) {
  const q = cachedCoreQuestions.find(q => q.id == id);
  if (!q) return;
  const newCorrect = (q.correct_count || 0) + 1;
  const today = new Date().toISOString().slice(0, 10);
  const newLog = [...(q.review_log || []), { date: today, result: 'correct' }];
  try {
    const res = await sb.from('core_questions').update({ correct_count: newCorrect, review_log: newLog }).eq('id', id);
    if (res.error) throw res.error;
    await reloadCoreQuestions();
    await refreshMainContent();
    showToast(newCorrect >= 5 ? '恭喜！已完成！' : '答对了（' + newCorrect + '/5）');
  } catch (err) { showToast('记录失败: ' + (err.message || err.details || JSON.stringify(err))); }
}

async function markCoreWrong(id) {
  const q = cachedCoreQuestions.find(q => q.id == id);
  if (!q) return;
  const newWrong = (q.wrong_count || 0) + 1;
  const today = new Date().toISOString().slice(0, 10);
  const newLog = [...(q.review_log || []), { date: today, result: 'wrong' }];
  try {
    const res = await sb.from('core_questions').update({ wrong_count: newWrong, review_log: newLog }).eq('id', id);
    if (res.error) throw res.error;
    await reloadCoreQuestions();
    await refreshMainContent();
    showToast('已记录（答错 ' + newWrong + ' 次）');
  } catch (err) { showToast('记录失败: ' + (err.message || err.details || JSON.stringify(err))); }
}

// ==================== 渲染：侧边栏 ====================

  container.innerHTML = cachedChapters.map((ch, idx) => {
    const childKps = cachedKps.filter(kp => kp.chapter_id === ch.id);
    const coreQCount = cachedCoreQuestions.filter(q => q.chapter_id == ch.id).length;
    const totalQuestions = childKps.reduce((sum, kp) =>
      sum + cachedQuestions.filter(q => q.knowledge_point_id === kp.id).length, 0) + coreQCount;
    const isExpanded = selectedChapterId == ch.id;

    return `
      <div class="tree-chapter" data-id="${ch.id}">
        <div class="chapter-header ${selectedChapterId == ch.id ? 'active' : ''}"
             draggable="true"
             ondragstart="onDragStart(event, 'chapter', ${ch.id})"
             ondragover="onDragOverChapter(event)"
             ondragleave="onDragLeaveChapter(event)"
             ondrop="onDropChapter(event, ${ch.id})"
             onclick="selectChapter(${ch.id})">
          <span class="drag-handle" title="拖动排序">⠿</span>
          <span class="icon">📁</span>
          <span class="name">${escapeHtml(ch.name)}
            <button class="edit-btn" onclick="event.stopPropagation();showChapterModal(${ch.id}, '${escapeHtml(ch.name).replace(/'/g, "\\'")}')" title="重命名">✎</button>
          </span>
          <span class="count">${totalQuestions}</span>
          <button class="del-chapter" onclick="event.stopPropagation();deleteChapter(${ch.id})">×</button>
        </div>
        <div class="kp-list ${isExpanded ? 'open' : ''}">
          ${childKps.map((kp, kpIdx) => {
            const kpCount = cachedQuestions.filter(q => q.knowledge_point_id === kp.id).length;
            return `
              <div class="kp-item ${selectedKpId == kp.id ? 'active' : ''}" data-id="${kp.id}"
                   draggable="true"
                   ondragstart="onDragStart(event, 'kp', ${kp.id}, ${ch.id})"
                   ondragover="onDragOverKp(event)"
                   ondragleave="onDragLeaveKp(event)"

          <div style="border-top:1px dashed #e0e0e0;margin:6px 0 2px;"></div>
          <div class="kp-item ${selectedCoreChapterId == ch.id ? 'active' : ''}" 
               style="font-weight:600;color:#e67e22;"

            <span style="font-size:12px;">重要例题</span>

}

    '<div class="empty-state"><div class="empty-icon">📂</div><p>请选择具体知识点查看错题</p></div>';

async function selectKp(kpId) {

function showEbbModal(id, name, firstDate, subject) {
  if (id) {
    document.getElementById('ebbModalTitle').textContent = '编辑背诵项';
    document.getElementById('ebbNameInput').value = name;
    document.getElementById('ebbDateInput').value = firstDate;
    document.getElementById('ebbSubjectSelect').value = subject || '专业课';
    document.getElementById('editEbbId').value = id;
  } else {
    document.getElementById('ebbModalTitle').textContent = '添加背诵项';
    document.getElementById('ebbNameInput').value = '';
    document.getElementById('ebbDateInput').value = new Date().toISOString().slice(0, 10);
    document.getElementById('ebbSubjectSelect').value = ebbSubject;
    document.getElementById('editEbbId').value = '';
  }
  openModal('ebbModal');
  setTimeout(() => document.getElementById('ebbNameInput').focus(), 100);
}

async function saveEbbItem() {
  const name = document.getElementById('ebbNameInput').value.trim();
  const firstDate = document.getElementById('ebbDateInput').value;
  const subject = document.getElementById('ebbSubjectSelect').value;
  const editId = document.getElementById('editEbbId').value;
  if (!name) { showToast('请输入背诵内容'); return; }
  try {
    let res;
    let existingReviews = [];
    if (editId) {
      const existing = cachedEbbItems.find(e => e.id == editId);
      existingReviews = (existing && existing.reviews) ? existing.reviews : [];
    }
    const payload = { name, first_date: firstDate, subject, reviews: editId ? existingReviews : [] };
    if (editId) {
      // Try with subject first, fallback without
      res = await sb.from('ebbinghaus_items').update(payload).eq('id', editId);
      if (res.error) {
        console.warn('update 带 subject 失败，重试无 subject:', res.error.message);
        delete payload.subject;
        res = await sb.from('ebbinghaus_items').update(payload).eq('id', editId);
      }
    } else {
      res = await sb.from('ebbinghaus_items').insert(payload);
      if (res.error) {
        console.warn('insert 带 subject 失败，重试无 subject:', res.error.message);
        delete payload.subject;
        res = await sb.from('ebbinghaus_items').insert(payload);
      }
    }
    if (res.error) throw res.error;
    await reloadEbb();
    closeModal('ebbModal');
    renderEbb();
    showToast(editId ? '已更新' : '已添加');
  } catch (err) { showToast('保存失败: ' + (err.message || err.details || JSON.stringify(err))); }
}

async function toggleEbbReview(itemId, intervalDay) {
  const item = cachedEbbItems.find(e => e.id == itemId);
  if (!item) return;
  let reviews = item.reviews || [];
  // Normalize old format (array of strings) to new format (array of objects)
  reviews = reviews.map(r => typeof r === 'string' ? { day: parseInt(r, 10) || 0, date: r } : r);
  const existing = reviews.find(r => r.day === intervalDay);
  if (existing) {
    reviews = reviews.filter(r => r.day !== intervalDay);
  } else {
    reviews.push({ day: intervalDay, date: formatDate(new Date()) });
  }
  try {
    const res = await sb.from('ebbinghaus_items').update({ reviews }).eq('id', itemId);
    if (res.error) throw res.error;
    await reloadEbb();
    renderEbb();
  } catch (err) { showToast('更新失败: ' + (err.message || err.details || JSON.stringify(err))); }
}

function formatDate(d) {
  d = new Date(d);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// 动态计算每个复习轮次的应复习日期（逾期自动后延到今日）
function getEbbDynamicSchedule(item) {
  let reviews = item.reviews || [];
  reviews = reviews.map(r => typeof r === 'string' ? { day: parseInt(r, 10) || 0, date: r } : r);
  const firstDate = item.first_date;
  const today = formatDate(new Date());
  const subj = item.subject || '专业课';
  const intervals = EBB_INTERVALS;
  const result = [];

  for (let i = 0; i < intervals.length; i++) {
    const interval = intervals[i];
    const prevInterval = i > 0 ? intervals[i - 1] : 0;
    const prevReview = i > 0 ? reviews.find(r => r.day === intervals[i - 1]) : null;

    let scheduled;
    if (i === 0) {
      const d = new Date(firstDate);
      d.setDate(d.getDate() + interval);
      scheduled = formatDate(d);
    } else if (prevReview) {
      const d = new Date(prevReview.date);
      d.setDate(d.getDate() + (interval - prevInterval));
      scheduled = formatDate(d);
    } else {
      const d = new Date(firstDate);
      d.setDate(d.getDate() + interval);
      scheduled = formatDate(d);
    }

    // 逾期自动后延到今日
    if (scheduled < today) scheduled = today;

    const review = reviews.find(r => r.day === interval);
    result.push({
      day: interval,
      scheduled,
      done: !!review,
      reviewDate: review ? review.date : null,
      reviewNote: review ? (review.note || '') : ''
    });
  }
  return result;
}

              if (slot.done) {

// 甘特图：按住拖动平移日期窗口，替代前两周/后两周按钮
let tlDrag = { active: false, startX: 0, dx: 0, dayWidth: 28, el: null, inner: null };
let tlMoved = false;
function tlDragStart(e) {
  const el = e.currentTarget;
  const inner = el.querySelector('.tl-inner');
  if (!inner) return;
  const dayEl = inner.querySelector('.tl-days .tl-day');
  tlDrag.active = true;
  tlDrag.startX = e.pageX;
  tlDrag.dx = 0;
  tlDrag.dayWidth = (dayEl && dayEl.offsetWidth) || 28;
  tlDrag.el = el;
  tlDrag.inner = inner;
  tlMoved = false;
  el.classList.add('dragging');
}
function tlDragMove(e) {
  if (!tlDrag.active || !tlDrag.inner) return;
  const dx = e.pageX - tlDrag.startX;
  if (Math.abs(dx) > 5) tlMoved = true;
  if (tlMoved) { e.preventDefault(); tlDrag.dx = dx; tlDrag.inner.style.transform = 'translateX(' + dx + 'px)'; }
}
function tlDragEnd() {
  if (!tlDrag.active) return;
  if (tlDrag.el) tlDrag.el.classList.remove('dragging');
  const dx = tlDrag.dx;
  if (tlMoved && Math.abs(dx) > 5) {
    const shiftDays = -Math.round(dx / tlDrag.dayWidth);
    if (shiftDays !== 0) {
      const s = new Date(tlRangeStart); s.setDate(s.getDate() + shiftDays); tlRangeStart = formatDate(s);
      const e = new Date(tlRangeEnd); e.setDate(e.getDate() + shiftDays); tlRangeEnd = formatDate(e);
      renderTimeline();
      tlDrag.active = false; tlDrag.el = null; tlDrag.inner = null;
      return;
    }
  }
  if (tlDrag.inner) tlDrag.inner.style.transform = '';
  tlDrag.active = false; tlDrag.el = null; tlDrag.inner = null;
}
document.addEventListener('mousemove', tlDragMove);
document.addEventListener('mouseup', tlDragEnd);
document.addEventListener('click', (e) => {
  if (tlMoved) { tlMoved = false; e.stopPropagation(); e.preventDefault(); }
}, true);

  }

  const startD = new Date(tlRangeStart);
  const endD = new Date(tlRangeEnd);
  const dayCount = Math.round((endD - startD) / 86400000) + 1;

  const dayHeaders = [];
  for (let i = 0; i < dayCount; i++) {
    const d = new Date(startD);
    d.setDate(d.getDate() + i);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = formatDate(d) === today;
    dayHeaders.push(`<div class="tl-day${isToday ? ' today' : ''}${isWeekend ? ' weekend' : ''}" style="${isToday ? 'font-weight:700;color:#e74c3c' : ''}">
      ${d.getMonth()+1}/${d.getDate()}
    </div>`);
  }
  const daySlots = '<div class="tl-day-slot"></div>'.repeat(dayCount);

  const subjects = ['数学', '专业课', '英语', '政治'];
  const todayIdx = Math.round((new Date(today) - startD) / 86400000);
  const todayPct = (todayIdx / dayCount) * 100;

  container.innerHTML = viewToggle + `
    <div class="tl-legend">
      ${subjects.map(s => `<span><span class="tl-l-dot" style="background:${SUBJECT_COLORS[s]}"></span>${s}</span>`).join('')}
    </div>
    <div class="tl-wrap" onmousedown="tlDragStart(event)">
      <div class="tl-inner">
        <div class="tl-header">
          <div class="tl-label-col">科目</div>
          <div class="tl-days">${dayHeaders.join('')}</div>
        </div>
        ${subjects.map(subj => {
          const events = cachedTimeline.filter(e => e.subject === subj);
          if (events.length === 0) {
            return `<div class="tl-row">
              <div class="tl-row-label">${subj}</div>
              <div class="tl-row-track">${daySlots}${todayIdx >= 0 && todayIdx < dayCount ? `<div class="tl-today-line" style="left:${todayPct}%"></div>` : ''}</div>
            </div>`;
          }
          // Compute lane assignment for overlapping events
          const BAR_H = 28, BAR_GAP = 4, TOP_PAD = 4;
          const eventMeta = events.map(ev => {
            const evStart = new Date(ev.start_date);
            const evEnd = new Date(ev.end_date);
            const startIdx = Math.round((evStart - startD) / 86400000);
            const endIdx = Math.round((evEnd - startD) / 86400000);
            return { ev, startIdx, endIdx, lane: -1 };
          }).filter(m => m.endIdx >= 0 && m.startIdx < dayCount);
          let maxLane = 0;
          for (const m of eventMeta) {
            let lane = 0;
            while (true) {
              const conflict = eventMeta.find(o => o !== m && o.lane === lane &&
                !(m.endIdx < o.startIdx || m.startIdx > o.endIdx));
              if (!conflict) break;
              lane++;
            }
            m.lane = lane;
            if (lane > maxLane) maxLane = lane;
          }
          const numLanes = maxLane + 1;
          const rowH = TOP_PAD * 2 + numLanes * (BAR_H + BAR_GAP);
          return `<div class="tl-row" style="min-height:${rowH}px">
            <div class="tl-row-label" style="min-height:${rowH}px">${subj}</div>
            <div class="tl-row-track" style="min-height:${rowH}px">
              ${daySlots}
              ${todayIdx >= 0 && todayIdx < dayCount ? `<div class="tl-today-line" style="left:${todayPct}%"></div>` : ''}
              ${eventMeta.map(m => {
                const ev = m.ev;
                const startIdx = m.startIdx, endIdx = m.endIdx;
                const left = Math.max(0, (startIdx / dayCount) * 100);
                const width = Math.max(2, ((Math.min(endIdx, dayCount - 1) - Math.max(startIdx, 0) + 1) / dayCount) * 100);
                const top = TOP_PAD + m.lane * (BAR_H + BAR_GAP);
                const grad = SUBJECT_GRADIENTS[subj] || `linear-gradient(90deg, ${SUBJECT_COLORS[subj]}, ${SUBJECT_COLORS[subj]})`;
                return `<div class="tl-event" style="left:${left}%;width:${width}%;top:${top}px;height:${BAR_H}px;background:${grad}" onclick="showTlModal(${ev.id}, '${ev.subject}', '${escapeHtml(ev.label).replace(/'/g, "\\'")}', '${ev.start_date}', '${ev.end_date}')">
                  ${escapeHtml(ev.label)}
                  <span class="tl-del" onclick="event.stopPropagation();deleteTlEvent(${ev.id})">×</span>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` + '<div id="scheduleSection"></div>';
  if (!scheduleLoaded) { Promise.all([reloadSchedule(), reloadTimeSlots().catch(() => {})]).then(() => { scheduleLoaded = true; renderScheduleGrid(); }); }
  else renderScheduleGrid();
}

async function renderCalendar() {
  const months = [
    { name: '7月', start: new Date(2026, 6, 1), days: 31 },
    { name: '8月', start: new Date(2026, 7, 1), days: 31 },
    { name: '9月', start: new Date(2026, 8, 1), days: 30 },
    { name: '10月', start: new Date(2026, 9, 1), days: 31 },
    { name: '11月', start: new Date(2026, 10, 1), days: 30 },
    { name: '12月', start: new Date(2026, 11, 1), days: 31 },
  ];
  const today = formatDate(new Date());
  const todayKey = today;

  const subjColors = { '专业课': '#27ae60', '数学': '#4a90d9', '英语': '#e67e22', '政治': '#9b59b6' };
  const subjOrder = ['数学', '英语', '专业课', '政治'];
  const goalsData = await getGoalsData();
  const renderedGoalWeeks = new Set();

  return `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
      ${months.map(m => {
        const startDow = m.start.getDay();
        const todayMonth = 2026 + '-' + String(m.start.getMonth() + 1).padStart(2, '0');

        // Month goals
        const monthGoals = goalsData.find(g => g.month === m.name);
        const goalSubjects = monthGoals ? Object.entries(monthGoals.subjects).filter(([, v]) => v.goal).sort((a, b) => subjOrder.indexOf(a[0]) - subjOrder.indexOf(b[0])) : [];

        // Build week goal map
        const monthWeekBase = getGlobalWeek(formatDate(m.start));
        const weekGoals = {};
        if (monthGoals) {
          for (const [s, sd] of Object.entries(monthGoals.subjects)) {
            for (const [wk, txt] of Object.entries(sd.weeks)) {
              if (txt && txt.trim()) {
                const gwk = monthWeekBase + parseInt(wk) - 1;
                if (!weekGoals[gwk]) weekGoals[gwk] = {};
                weekGoals[gwk][s] = txt;
              }
            }
          }
        }

        // Gather month dates
        const monthDates = [];
        for (let d = 1; d <= m.days; d++) {
          const ds = todayMonth + '-' + String(d).padStart(2, '0');
          const events = cachedTimeline.filter(ev => ev.end_date === ds);
          const impDate = IMPORTANT_DATES.find(id => id.date === ds);
          const globalWeek = getGlobalWeek(ds);
          monthDates.push({ day: d, date: ds, events, impDate, globalWeek });
        }

        // Month goal summary (below month name)
        const goalSummary = goalSubjects.length > 0 ? goalSubjects.map(([s, v]) => {
          return `<span style="display:inline-block;font-size:9px;line-height:1.4;border:1px dashed ${subjColors[s]};background:${subjColors[s]}18;border-radius:4px;padding:2px 6px;white-space:normal;word-break:break-all;">
            <b style="color:${subjColors[s]};margin-right:2px;">${s}</b>${escapeHtml(v.goal)}
          </span>`;
        }).join('') : '';

        // Day cell renderer
        function cell(md) {
          const isToday = md.date === todayKey;
          const hasEvents = md.events.length > 0;
          const hasImp = md.impDate;
          let bg = '', tc = '';
          if (isToday) { bg = 'background:#e74c3c;'; tc = 'color:#fff;font-weight:700;'; }
          else if (hasImp) { bg = 'background:' + md.impDate.color + ';'; tc = 'color:#fff;'; }
          else if (hasEvents) bg = 'background:#f0f6ff;';
          return `<div style="position:relative;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;cursor:${hasImp?'pointer':'default'};${bg}${tc}" title="${md.date}${md.impDate?' · '+md.impDate.label:''}${hasEvents?' · '+md.events.map(e=>e.label).join(', '):''}">
            <span style="font-size:10px;line-height:1;">${md.day}</span>
            ${hasImp ? `<span style="font-size:7px;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${md.impDate.icon}</span>` : ''}
            ${hasEvents ? md.events.map(e => `<span style="font-size:7px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${tc?'#fff':(e.color||subjColors[e.subject])};">${escapeHtml(e.label)}</span>`).join('') : ''}
          </div>`;
        }

        // Build week rows with goal bars between
        const totalCells = startDow + m.days;
        const numRows = Math.ceil(totalCells / 7);
        const gridRows = [];

        for (let row = 0; row < numRows; row++) {
          const cells = [];
          // Count global weeks in this calendar row to determine the primary week
          const gwsCount = {};
          for (let col = 0; col < 7; col++) {
            const pos = row * 7 + col;
            if (pos < startDow || pos >= totalCells) {
              cells.push('<div></div>');
            } else {
              const md = monthDates[pos - startDow];
              cells.push(cell(md));
              gwsCount[md.globalWeek] = (gwsCount[md.globalWeek] || 0) + 1;
            }
          }
          gridRows.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;">${cells.join('')}</div>`);

          // Week goal bar — use primary (most common) global week in this row
          let primaryGW = null, maxCount = 0;
          for (const [gw, cnt] of Object.entries(gwsCount)) {
            if (cnt > maxCount) { maxCount = cnt; primaryGW = parseInt(gw); }
          }
          if (primaryGW && !renderedGoalWeeks.has(primaryGW)) {
            renderedGoalWeeks.add(primaryGW);
            const goals = weekGoals[primaryGW] || {};
            const entries = Object.entries(goals).filter(([, t]) => t && t.trim()).sort((a, b) => subjOrder.indexOf(a[0]) - subjOrder.indexOf(b[0]));
            if (entries.length > 0) {
              gridRows.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;">
                <div style="grid-column:1/-1;padding:2px 6px;font-size:9px;line-height:1.4;background:#fafbfc;border-top:1px solid #eee;display:flex;flex-direction:column;gap:1px;">
                  ${entries.map(([s, txt]) => `<span style="display:flex;align-items:center;gap:2px;"><span style="color:#aaa;font-weight:600;font-size:8px;">W${primaryGW}</span><span style="width:5px;height:5px;border-radius:50%;background:${subjColors[s]};flex-shrink:0;"></span><b style="color:${subjColors[s]};font-size:9px;">${s}</b><span style="color:#666;">${txt}</span></span>`).join('')}
                </div></div>`);
            }
          }
        }

        return `<div style="background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;">
          <div style="font-weight:700;font-size:14px;text-align:center;padding:4px 0 4px;color:#333;display:flex;align-items:center;justify-content:center;gap:6px;">
            ${m.name}
          </div>
          ${goalSummary ? `<div style="margin-bottom:2px;padding:0 2px;display:flex;flex-direction:column;gap:2px;">${goalSummary}</div>` : ''}
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px;text-align:center;color:#999;margin-bottom:2px;">
            ${['日','一','二','三','四','五','六'].map(d => `<div>${d}</div>`).join('')}
          </div>
          ${gridRows.join('')}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:#888;">
      <span>重要节点：</span>
      ${IMPORTANT_DATES.map(d => `<span style="display:flex;align-items:center;gap:3px;"><span style="width:8px;height:8px;border-radius:50%;background:${d.color};display:inline-block;"></span>${d.date} ${d.icon} ${d.label}</span>`).join('')}
    </div>
    ${renderGoalOverviewTable(months, goalsData, subjOrder)}`;
}

function renderGoalOverviewTable(months, goalsData, subjOrder) {
  // 各月周目标的全局周编号（相对周1对应 monthWeekStart）
  const monthWeekStart = { '7月': 3, '8月': 7, '9月': 11, '10月': 15, '11月': 19, '12月': 23 };
  const monthWeekCount = { '7月': 4, '8月': 4, '9月': 4, '10月': 4, '11月': 4, '12月': 3 };

  // 全局周列表（W3 ~ W25），记录每周所属月份
  const globalWeeks = [];
  months.forEach(m => {
    const start = monthWeekStart[m.name];
    const cnt = monthWeekCount[m.name] || 4;
    for (let i = 0; i < cnt; i++) globalWeeks.push({ w: start + i, month: m.name });
  });

  // 月份列文字颜色：7月最浅，逐月加深
  const monthColors = months.map((m, i) => {
    const ratio = months.length <= 1 ? 1 : i / (months.length - 1);
    const v = Math.round(180 - ratio * 140);
    return `rgb(${v},${v},${v})`;
  });

  const th = (title, width, color) => `<th style="padding:6px 8px;border:1px solid #eee;background:#f5f7fa;text-align:center;${width ? 'width:' + width + ';' : ''}${color ? 'color:' + color + ';' : ''}white-space:nowrap;">${title}</th>`;
  const cellStyle = (color, extra) => `padding:6px 8px;border:1px solid #eee;text-align:left;vertical-align:top;word-break:break-all;white-space:normal;${color ? 'color:' + color + ';' : ''}${extra || ''}`;
  const emptyCell = `<td style="padding:6px 8px;border:1px solid #f5f5f5;background:#fcfcfc;"></td>`;

  const monthCell = (m, s, field, extra) => {
    const mg = goalsData.find(g => g.month === m.name);
    let val = '', name;
    if (field === 'goal') {
      val = mg?.subjects?.[s]?.goal || '';
      name = `ov|${m.name}|${s}|goal`;
    } else {
      const rel = field - monthWeekStart[m.name] + 1;
      val = mg?.subjects?.[s]?.weeks?.[String(rel)] || '';
      name = `ov|${m.name}|${s}|week|${rel}`;
    }
    const mi = months.findIndex(x => x.name === m.name);
    const color = monthColors[mi] || '#333';
    const content = goalOverviewEdit
      ? `<textarea name="${name}" style="width:100%;min-height:32px;padding:2px 4px;border:1px solid #ddd;border-radius:3px;font-size:10px;resize:vertical;box-sizing:border-box;">${escapeHtml(val)}</textarea>`
      : (escapeHtml(val) || '<span style="color:#ccc;">—</span>');
    return `<td style="${cellStyle(color, extra)}">${content}</td>`;
  };

  const rows = subjOrder.map(s => {
    // 总目标行：科目 + 各月总目标（加粗灰底）
    const goalRow = `<tr>
      <td rowspan="${globalWeeks.length + 1}" style="padding:6px 8px;border:1px solid #eee;text-align:center;vertical-align:middle;background:${SUBJECT_COLORS[s]}18;color:${SUBJECT_COLORS[s]};font-weight:700;">${s}</td>
      <td style="padding:4px 8px;border:1px solid #eee;background:#e9ecef;color:#000;font-weight:700;text-align:center;font-size:10px;white-space:nowrap;">总目标</td>
      ${months.map(m => monthCell(m, s, 'goal', 'background:#e9ecef;font-weight:700;')).join('')}
    </tr>`;
    // 周目标行：按全局周编号展开，仅该周所属月份列有内容
    const weekRows = globalWeeks.map(gw => {
      const cells = months.map(m => m.name === gw.month ? monthCell(m, s, gw.w) : emptyCell).join('');
      return `<tr>
        <td style="padding:4px 8px;border:1px solid #eee;background:#fafbfc;color:#666;font-weight:600;text-align:center;font-size:10px;white-space:nowrap;">W${gw.w}</td>
        ${cells}
      </tr>`;
    }).join('');
    return goalRow + weekRows;
  }).join('');

  const table = `
    <table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;">
      <thead>
        <tr>${th('科目', '64px')}${th('目标', '52px')}${months.map((m, i) => th(m.name, '', monthColors[i])).join('')}</tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  const inner = goalOverviewEdit
    ? `<form id="goalOverviewForm" data-original="${encodeURIComponent(JSON.stringify(goalsData))}">${table}</form>`
    : table;

  return `
    <div style="margin-top:16px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="font-weight:700;font-size:14px;color:#333;">目标一览表</div>
        <div style="display:flex;gap:6px;">
          ${goalOverviewEdit
            ? `<button onclick="saveGoalOverview()" style="font-size:11px;padding:3px 10px;background:#e67e22;color:#fff;border:none;border-radius:4px;cursor:pointer;">保存</button>
               <button onclick="cancelGoalOverview()" style="font-size:11px;padding:3px 10px;background:#f0f0f0;color:#666;border:none;border-radius:4px;cursor:pointer;">取消</button>`
            : `<button onclick="editGoalOverview()" style="font-size:11px;padding:3px 10px;background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer;">编辑</button>`}
        </div>
      </div>
      <div style="overflow-x:auto;">${inner}</div>
    </div>`;
}

function renderScheduleGrid() {
  const container = document.getElementById('scheduleSection');
  if (!container) return;
  
  const startD = new Date(scheduleDateRange.start);
  const endD = new Date(scheduleDateRange.end);
  const dayCount = Math.round((endD - startD) / 86400000) + 1;
  const today = formatDate(new Date());
  
  const dates = [];
  for (let i = 0; i < dayCount; i++) {
    const d = new Date(startD);
    d.setDate(d.getDate() + i);
    dates.push({ date: formatDate(d), day: d.getDate(), month: d.getMonth() + 1, dow: d.getDay() });
  }

  const sortedSlots = [...scheduleTimeSlots].sort();

  const tbodyHTML = scheduleTimeSlots.length === 0 ? `
    <tr>
      <td colspan="${dates.length + 1}" style="padding:24px;text-align:center;color:#bbb;">
        暂无时段，点击 <button onclick="addTimeSlot()" style="font-size:12px;padding:4px 12px;background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer;">+ 添加时段</button> 开始记录
      </td>
    </tr>` : sortedSlots.map((slot) => {
      return `<tr>
        <td style="padding:6px 8px;border-right:1px solid #e0e0e0;border-bottom:1px solid #f0f0f0;text-align:center;font-weight:600;color:#555;position:relative;">
          ${slot}
          <button onclick="deleteTimeSlot('${slot}')" class="slot-del" style="position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:14px;color:#ccc;background:none;border:none;cursor:pointer;display:none;">×</button>
        </td>
        ${dates.map(d => {
          const cellRecords = cachedSchedule.filter(r => r.record_date === d.date && r.time_slot === slot);
          if (cellRecords.length === 0) {
            return `<td style="padding:2px;border-right:1px solid #f8f8f8;border-bottom:1px solid #f0f0f0;text-align:center;vertical-align:top;cursor:pointer;"
              onclick="openScheduleModal('${slot}', '${d.date}')"></td>`;
          }
          return `<td style="padding:0;border-right:1px solid #f8f8f8;border-bottom:1px solid #f0f0f0;text-align:center;vertical-align:top;cursor:pointer;"
            onclick="openScheduleModal('${slot}', '${d.date}')">
            <div style="display:flex;flex-direction:column;height:100%;">
            ${cellRecords.map(r => {
              const cellBg = getScheduleCellColor(r.subject, r.label);
              const errorBookIcon = r.in_error_book ? ' 📖' : '';
              return `<div style="margin:1px 0;padding:2px 4px;border-radius:2px;font-size:9px;color:#fff;white-space:normal;word-break:break-all;line-height:1.3;background:${cellBg};cursor:pointer;flex:1;"
                onclick="event.stopPropagation();editScheduleRecordModal(${r.id}, '${(r.subject||'').replace(/'/g, "\\'")}', '${(r.label||'').replace(/'/g, "\\'")}', '${slot}', '${d.date}', ${r.in_error_book||false})">
                ${escapeHtml(r.label || r.subject)}${errorBookIcon}
              </div>`;
            }).join('')}
            </div>
          </td>`;
          }).join('')}
      </tr>`;
    }).join('');

  container.innerHTML = `
    <div style="margin-top:20px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;flex-wrap:wrap;gap:8px;">
        <span style="font-weight:700;font-size:14px;color:#333;">滚动复习记录</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <span style="font-size:11px;color:#888;">${scheduleDateRange.start} ~ ${scheduleDateRange.end}</span>
          <span style="font-size:10px;color:#bbb;">（可左右拖动查看）</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button onclick="addTimeSlot()" style="font-size:11px;padding:5px 12px;border:1px solid #4a90d9;border-radius:4px;background:#fff;color:#4a90d9;cursor:pointer;white-space:nowrap;">+ 时段</button>
          <button onclick="addTodayRecord()" style="font-size:11px;padding:5px 12px;border:none;border-radius:4px;background:#4a90d9;color:#fff;cursor:pointer;white-space:nowrap;">+ 今日记录</button>
        </div>
      </div>
      <div class="schedule-scroll" style="overflow-x:auto;" onmousedown="schDragStart(event)">
        <table class="schedule-table" style="width:100%;border-collapse:collapse;font-size:11px;min-width:600px;">
          <thead>
            <tr>
              <th style="padding:6px 8px;background:#f5f7fa;border-right:1px solid #e0e0e0;text-align:center;width:70px;min-width:70px;">时段</th>
              ${dates.map(d => `<th style="padding:6px 2px;background:#f5f7fa;border-right:1px solid #f0f0f0;text-align:center;width:40px;${d.date===today?'color:#e74c3c;font-weight:700;':''}${d.dow===0||d.dow===6?'color:#e74c3c;':''}">
                ${d.month}/${d.day}<br><small style="font-weight:normal;">${['日','一','二','三','四','五','六'][d.dow]}</small>
              </th>`).join('')}
            </tr>
          </thead>
          <tbody>${tbodyHTML}</tbody>
        </table>
      </div>
    </div>`;
  // 等DOM渲染完成后统一每行td高度，消除色块留白
  requestAnimationFrame(() => {
    const table = container.querySelector('table.schedule-table');
    if (!table) return;
    const rows = table.querySelectorAll('tbody tr');
    rows.forEach(row => {
      const tds = row.querySelectorAll('td');
      let maxH = 0;
      tds.forEach(td => { const h = td.scrollHeight; if (h > maxH) maxH = h; });
      tds.forEach(td => { td.style.height = maxH + 'px'; });
    });
  });
}

// 滚动复习表：按住拖动平移日期窗口，替代前3天/后3天按钮
let schDrag = { active: false, startX: 0, dx: 0, dayWidth: 40, el: null, table: null };
let schMoved = false;
function schDragStart(e) {
  const el = e.currentTarget;
  const table = el.querySelector('table.schedule-table');
  if (!table) return;
  const dayTh = table.querySelector('thead th:nth-child(2)');
  schDrag.active = true;
  schDrag.startX = e.pageX;
  schDrag.dx = 0;
  schDrag.dayWidth = (dayTh && dayTh.offsetWidth) || 40;
  schDrag.el = el;
  schDrag.table = table;
  schMoved = false;
  el.classList.add('dragging');
}
function schDragMove(e) {
  if (!schDrag.active || !schDrag.table) return;
  const dx = e.pageX - schDrag.startX;
  if (Math.abs(dx) > 5) schMoved = true;
  if (schMoved) { e.preventDefault(); schDrag.dx = dx; schDrag.table.style.transform = 'translateX(' + dx + 'px)'; }
}
function schDragEnd() {
  if (!schDrag.active) return;
  if (schDrag.el) schDrag.el.classList.remove('dragging');
  const dx = schDrag.dx;
  if (schMoved && Math.abs(dx) > 5) {
    const shiftDays = -Math.round(dx / schDrag.dayWidth);
    if (shiftDays !== 0) {
      const start = new Date(scheduleDateRange.start);
      start.setDate(start.getDate() + shiftDays);
      scheduleDateRange.start = formatDate(start);
      const end = new Date(scheduleDateRange.end);
      end.setDate(end.getDate() + shiftDays);
      scheduleDateRange.end = formatDate(end);
      reloadSchedule().then(() => renderScheduleGrid());
      schDrag.active = false; schDrag.el = null; schDrag.table = null;
      return;
    }
  }
  if (schDrag.table) schDrag.table.style.transform = '';
  schDrag.active = false; schDrag.el = null; schDrag.table = null;
}
document.addEventListener('mousemove', schDragMove);
document.addEventListener('mouseup', schDragEnd);
document.addEventListener('click', (e) => {
  if (schMoved) { schMoved = false; e.stopPropagation(); e.preventDefault(); }
}, true);

async function addTimeSlot() {
  const slot = prompt('输入时间段（如 8:00-9:00）', '');
  if (!slot || !slot.trim()) return;
  if (!slot.includes('-')) { showToast('格式：8:00-9:00'); return; }
  const slotName = slot.trim();
  try {
    const res = await sb.from('schedule_time_slots').insert({ slot_name: slotName, sort_order: scheduleTimeSlots.length });
    if (res.error) throw res.error;
    await reloadTimeSlots();
    renderScheduleGrid();
    showToast('时段已添加');
  } catch (err) { showToast('添加失败: ' + (err.message || '')); }
}

async function deleteTimeSlot(slot) {
  if (!confirm('删除时间段 ' + slot + '？')) return;
  try {
    const res = await sb.from('schedule_time_slots').delete().eq('slot_name', slot);
    if (res.error) throw res.error;
    await reloadTimeSlots();
    renderScheduleGrid();
  } catch (err) { showToast('删除失败: ' + (err.message || '')); }
}

function onSchSubjectChange() {
  const isMath = document.getElementById('schSubject').value === '数学';
  document.getElementById('schSubTagGroup').style.display = isMath ? '' : 'none';
  document.getElementById('schErrorBookGroup').style.display = isMath ? '' : 'none';
}
function setSchSubTag(val) {
  const cur = document.getElementById('schSubTag').value;
  // Toggle: click again to unselect
  document.getElementById('schSubTag').value = (cur === val) ? '' : val;
  document.querySelectorAll('.sch-subtag-btn').forEach(btn => {
    btn.style.opacity = btn.textContent === val && cur !== val ? '1' : '0.5';
  });
}
function populateSlotCheckboxes(checkedSlots) {
  const list = document.getElementById('schTimeSlotList');
  list.innerHTML = scheduleTimeSlots.map(s =>
    `<label style="font-size:12px;padding:4px 8px;border:1px solid #d0d0d0;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:4px;background:${checkedSlots&&checkedSlots.includes(s)?'#e8f0fe':'#fff'};">
      <input type="checkbox" value="${s}" class="sch-slot-cb" ${checkedSlots&&checkedSlots.includes(s)?'checked':''} onchange="this.parentElement.style.background=this.checked?'#e8f0fe':'#fff'"> ${s}
    </label>`
  ).join('');
}

function getCheckedSlots() {
  return [...document.querySelectorAll('.sch-slot-cb:checked')].map(cb => cb.value);
}
